## Worker Cloudflare — pilotage-notion-worker
## Lit la base Notion « 🎯 Pilotage 26/27 » avec le token gardé en secret,
## renvoie {results:[...]} en GET. Base figée : ne sert QUE PILOT_DB_ID.
## Envoie aussi le digest de relances (Telegram + push web) une fois par jour ouvré.

name = "pilotage-notion-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Variables non secrètes.
[vars]
PILOT_DB_ID = "4a1701257479407f9d8f115c43540d78"   # base Notion autorisée (aucune autre)
DIGEST_HEURE = "8"                                  # heure de Paris à laquelle le digest part
COCKPIT_URL = "https://nastyjesus.github.io/dashboard-wassim/cockpit.html"
VAPID_SUBJECT = "mailto:loumiwassim@gmail.com"      # contact exigé par les services de push

# Deux passages UTC du lundi au vendredi : 6h UTC = 8h Paris l'été, 7h UTC = 8h Paris l'hiver.
# Le Worker ne garde que celui qui tombe sur DIGEST_HEURE à Paris, et se dédoublonne via KV.
[triggers]
crons = ["0 6,7 * * 1-5"]

# Abonnements push + marqueur anti-doublon du digest.
# Créé par :  npx wrangler kv namespace create PILOT_KV
[[kv_namespaces]]
binding = "PILOT_KV"
id = "3d7d24a5664c438fbb9763150dcadd5b"

# Secrets à provisionner via `wrangler secret put` (jamais en clair ici) :
#   NOTION_TOKEN              token d'intégration Notion (ntn_...)
#   PILOT_WRITE_KEY           clé d'écriture attendue dans X-Pilot-Key
#   TELEGRAM_TOKEN            token du bot (@BotFather)
#   TELEGRAM_CHAT_ID          identifiant du chat autorisé — un seul, le tien
#   TELEGRAM_WEBHOOK_SECRET   secret partagé posé au setWebhook
#   VAPID_PRIVATE_JWK         clé privée VAPID au format JWK (JSON sur une ligne)
#   VAPID_PUBLIC_KEY          clé publique VAPID en base64url

[observability]
enabled = true
