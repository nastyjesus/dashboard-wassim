  const r = await fetch(WORKER_URL, { method: "GET" });
  if (!r.ok) throw new Error("worker-" + r.status);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d.results || [];
}
async function apiWrite(method, body) {
  const r = await fetch(WORKER_URL, {
    method,
    headers: { "Content-Type": "application/json", "X-Pilot-Key": PILOT_KEY },
    body: JSON.stringify(body),
  });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok || d.error) throw new Error(d.error || ("http-" + r.status));

}

/* résultats Notion -> {clients, prospects} */
function mapRows(rows) {
  const clients = [], prospects = [];
  let objId = null, objData = null, tunId = null, tunData = null;
  rows.forEach((r) => {
    const p = r.properties || {};
    const title = (p["Client"] && p["Client"].title ? p["Client"].title.map((t) => t.plain_text).join("") : "").trim();
    if (title === CONFIG_TITLE) { /* page de config objectifs : hors clients/prospects */
      objId = r.id;
      try { objData = JSON.parse(rtext(p["Notes"]) || "null"); } catch (e) { objData = null; }
      return;
    }
    if (title === CONFIG_TUNNELS) { /* page de config tunnels */
      tunId = r.id;
      try { tunData = JSON.parse(rtext(p["Notes"]) || "null"); } catch (e) { tunData = null; }
      return;
    }
    const statut = p["Statut"] && p["Statut"].select ? p["Statut"].select.name : "Signé";
    const montant = p["Montant HT"] && p["Montant HT"].number != null ? p["Montant HT"].number : 0;
    if (statut === "Pipeline") {
      const etName = p["Étape"] && p["Étape"].select ? p["Étape"].select.name : "Prospect";
      prospects.push({
        id: r.id,
        societe: title,
        nom: rtext(p["Contact"]),
        etape: ETAPE_ID[etName] || "prospect",
        type: TYPE_ID[p["Type"] && p["Type"].select ? p["Type"].select.name : ""] || "",
        montant: montant || "",
        offre: rtext(p["Offre"]),
        source: p["Source"] && p["Source"].select ? p["Source"].select.name : "",
        relance: (p["Relance"] && p["Relance"].date ? p["Relance"].date.start : "") || "",
        note: rtext(p["Notes"]),
        maj: 0,
      });
    } else {
      const tName = p["Type"] && p["Type"].select ? p["Type"].select.name : "Autre ponctuel";
      const typeId = TYPE_ID[tName] || "ponc";
      const debutFull = p["Début"] && p["Début"].date ? p["Début"].date.start : null;
      const debut = debutFull ? debutFull.slice(0, 7) : FY[0].key;
      const duree = p["Durée mois"] && p["Durée mois"].number != null ? p["Durée mois"].number : (est(typeId).rec ? 6 : 1);
      let encMap = {};
      try { encMap = JSON.parse(rtext(p["Encaissements"]) || "{}") || {}; } catch (e) { encMap = {}; }
      const c = { id: r.id, nom: title, type: typeId, prix: montant, debut, duree, source: p["Source"] && p["Source"].select ? p["Source"].select.name : "", nombre: p["Nombre"] && p["Nombre"].number != null ? p["Nombre"].number : 1 };
      c.ech = echeances(c).map((e) => ({ ...e, encaisse: encMap[e.mkey] != null ? Number(encMap[e.mkey]) : null }));
      clients.push(c);
    }
  });
  return { clients, prospects, objId, objData, tunId, tunData };
}

/* ---- calculs du simulateur d'objectifs ---- */
const objValeurMission = (p) => Number(p.prix) * (p.type === "rec" ? Number(p.duree) || 1 : 1);
const objCaLigne = (p) => objValeurMission(p) * Number(p.qty);
function objCompute(prestas, heures, charges) {
  const rec = prestas.filter((p) => p.type === "rec");
  const caRec = rec.reduce((s, p) => s + objCaLigne(p), 0);
  const caOne = prestas.filter((p) => p.type === "one").reduce((s, p) => s + objCaLigne(p), 0);
  const total = caRec + caOne;
  const missionsRec = rec.reduce((s, p) => s + Number(p.qty), 0);
  const moisMoyens = missionsRec ? rec.reduce((s, p) => s + Number(p.qty) * (Number(p.duree) || 6), 0) / missionsRec : 6;
  const simultanes = (missionsRec * moisMoyens) / 12;
  const net = charges > 0 ? total - charges * 12 : null;
  return { caRec, caOne, total, missionsRec, simultanes, net };
}

/* ---- reste à faire EN NOMBRE DE CONTRATS : objectif (prestas) vs signé (contrats) ----
   Chaque prestation visée est rattachée à une famille de contrat, puis on compte
   combien de contrats de cette famille sont déjà signés. */
const OBJ_FAMILLES = [
  { id: "prog",  nom: "Programmes récurrents (SEO)" },
  { id: "site",  nom: "Sites web" },
  { id: "forma", nom: "Formations Claude" },
  { id: "bni",   nom: "BNI" },
];
function objFamille(p) {
  if (p.type === "rec") return "prog";
  const id = String(p.id);
  const nom = (p.nom || "").toLowerCase();
  if (id.startsWith("bni") || nom.includes("bni")) return "bni";
  if (nom.includes("site")) return "site";
  if (nom.includes("formation") || nom.includes("claude")) return "forma";
  return "ponc";
}
/* un contrat BNI porte plusieurs unités (nombre) ; les autres comptent pour 1 */
const contratUnites = (c) => (c.type === "bni" ? Number(c.nombre) || 1 : 1);
function resteContrats(prestas, clients) {
  const lignes = OBJ_FAMILLES.map((f) => {
    const objectif = prestas
      .filter((p) => objFamille(p) === f.id)
      .reduce((s, p) => s + (Number(p.qty) || 0), 0);
    const signe = clients
      .filter((c) => c.type === f.id)
      .reduce((s, c) => s + contratUnites(c), 0);
    return { id: f.id, nom: f.nom, objectif, signe, reste: Math.max(0, objectif - signe) };
  }).filter((l) => l.objectif > 0 || l.signe > 0);
  const objectif = lignes.reduce((s, l) => s + l.objectif, 0);
  const signe = lignes.reduce((s, l) => s + l.signe, 0);
  const reste = lignes.reduce((s, l) => s + l.reste, 0);
  return { lignes, objectif, signe, reste };
}

function Cockpit() {
  const [vue, setVue] = useState("pilotage");

  const [charges, setCharges] = useState(OBJ_DEPART.charges);

  const [confirmReset, setConfirmReset] = useState(false);
  const [objSaveEtat, setObjSaveEtat] = useState(""); // "" | "en cours" | "ok" | "err"

  /* tunnels d'acquisition */
  const [tunnels, setTunnels] = useState(TUN_DEPART);
  const [tunId, setTunId] = useState(null);
  const [tunSaveEtat, setTunSaveEtat] = useState("");
  const [fLevier, setFLevier] = useState(null); // { offre, phase, levier }

  const [fProspect, setFProspect] = useState(null);
  const [fClient, setFClient] = useState(null);
  const [signature, setSignature] = useState(null);
  const [aSupprimer, setASupprimer] = useState(null);

  async function reload() {
    setErreur("");
    try {
      const rows = await apiGet();
      const { clients, prospects, objId: oid, objData, tunId: tid, tunData } = mapRows(rows);
      setClients(clients);
      setProspects(prospects);
      setObjId(oid);
      setTunId(tid);
      if (tunData) setTunnels(mergeTun(tunData));
      if (objData && Array.isArray(objData.prestas)) {
        let pr = objData.prestas;
        /* migration : garantit les lignes BNI même sur une config existante */
        OBJ_DEPART.prestas.filter((b) => String(b.id).startsWith("bni-")).forEach((b) => {
          if (!pr.some((p) => p.id === b.id)) pr = [...pr, b];
        });
        setPrestas(pr);
        setHeures(objData.heures ?? 5);
        setCharges(objData.charges ?? 0);
      }
      setLive(true);
    } catch (e) {
      setLive(false);
      setErreur("Lecture Notion impossible (" + e.message + ").");
    } finally {
      setChargement(false);
    }
  }
  useEffect(() => { reload(); }, []);

  /* enveloppe une écriture : indicateur d'occupation + rechargement + message d'erreur */
  async function ecrire(fn, label) {
    setOccupe(true);
    try { await fn(); await reload(); }
    catch (e) { setErreur((label || "Enregistrement") + " impossible (" + e.message + ")."); }
    finally { setOccupe(false); }
  }

  /* ---- sauvegarde des objectifs dans Notion (page config), debouncée ---- */
  function persistObjectifs(nextPrestas, nextHeures, nextCharges) {
    const pp = nextPrestas !== undefined ? nextPrestas : prestas;
    const hh = nextHeures !== undefined ? nextHeures : heures;
    const cc = nextCharges !== undefined ? nextCharges : charges;
    if (window.__objTimer) clearTimeout(window.__objTimer);
    setObjSaveEtat("en cours");
    window.__objTimer = setTimeout(async () => {
      const fields = { "Client": CONFIG_TITLE, "Statut": "Config", "Notes": JSON.stringify({ prestas: pp, heures: hh, charges: cc }) };
      try {
        if (objId) await apiUpdate(objId, fields);
        else { const r = await apiCreate(fields); if (r && r.id) setObjId(r.id); }
        setObjSaveEtat("ok");
      } catch (e) { setObjSaveEtat("err"); }
    }, 900);
  }
  const majPresta = (id, champ, valeur) => { const np = prestas.map((p) => (p.id === id ? { ...p, [champ]: valeur } : p)); setPrestas(np); persistObjectifs(np); };
  const ajouterPresta = () => { const np = [...prestas, { id: Date.now(), nom: "Nouvelle prestation", detail: "", prix: 0, type: "rec", duree: 6, qty: 0 }]; setPrestas(np); persistObjectifs(np); };
  const supprimerPresta = (id) => { const np = prestas.filter((p) => p.id !== id); setPrestas(np); persistObjectifs(np); };
  const setHeuresObj = (h) => { setHeures(h); persistObjectifs(undefined, h); };
  const setChargesObj = (c) => { setCharges(c); persistObjectifs(undefined, undefined, c); };
  const reinitObjectifs = () => { setPrestas(OBJ_DEPART.prestas); setHeures(OBJ_DEPART.heures); setCharges(OBJ_DEPART.charges); persistObjectifs(OBJ_DEPART.prestas, OBJ_DEPART.heures, OBJ_DEPART.charges); setConfirmReset(false); };

  /* ---- sauvegarde des tunnels dans Notion (page config), debouncée ---- */
  function persistTunnels(next) {
    if (window.__tunTimer) clearTimeout(window.__tunTimer);
    setTunSaveEtat("en cours");
    window.__tunTimer = setTimeout(async () => {
      const fields = { "Client": CONFIG_TUNNELS, "Statut": "Config", "Notes": JSON.stringify(next) };
      try {
        if (tunId) await apiUpdate(tunId, fields);
        else { const r = await apiCreate(fields); if (r && r.id) setTunId(r.id); }
        setTunSaveEtat("ok");
      } catch (e) { setTunSaveEtat("err"); }
    }, 900);
  }
  const majTunnels = (next) => { setTunnels(next); persistTunnels(next); };
  const saveLevier = (offre, phase, lev) => {
    const cur = tunnels[offre][phase] || [];
    const exists = cur.some((l) => l.id === lev.id);
    const nl = exists ? cur.map((l) => (l.id === lev.id ? lev : l)) : [...cur, lev];
    majTunnels({ ...tunnels, [offre]: { ...tunnels[offre], [phase]: nl } });
  };
  const deleteLevier = (offre, phase, id) => {
    majTunnels({ ...tunnels, [offre]: { ...tunnels[offre], [phase]: (tunnels[offre][phase] || []).filter((l) => l.id !== id) } });
  };

  /* ---------------- calculs partagés ---------------- */
  const moisSigne = FY.map((o) =>
    clients.reduce((s, c) => s + (c.ech || []).filter((e) => e.mkey === o.key).reduce((x, e) => x + e.du, 0), 0)
  );
  const caSigne = moisSigne.reduce((a, b) => a + b, 0);
  let acc = 0; const cumulSigne = moisSigne.map((m) => (acc += m));

  const pipePondere = prospects
    .filter((p) => !["signe", "perdu"].includes(p.etape))
    .reduce((s, p) => s + (Number(p.montant) || 0) * etp(p.etape).proba, 0);
  const pipeBrut = prospects
    .filter((p) => !["signe", "perdu"].includes(p.etape))
    .reduce((s, p) => s + (Number(p.montant) || 0), 0);

  /* suivi mensuel des contrats (sans notion de paiement) */
  const moisContratsActifs = FY.map((o) => clients.filter((c) => (c.ech || []).some((e) => e.mkey === o.key)).length);
  const moisNouveaux = FY.map((o) => clients.filter((c) => c.debut === o.key).length);

  /* radar des renouvellements : fin de chaque contrat récurrent = début + durée */
  const idxNowR = (() => { const n = new Date(); return (n.getFullYear() - 2026) * 12 + (n.getMonth() + 1 - 9); })();
  const renouvellements = clients
    .filter((c) => est(c.type).rec)
    .map((c) => {
      const finIdx = idxOf(c.debut) + (Number(c.duree) || 6) - 1;
      const moisRestants = finIdx - idxNowR;
      const statut = moisRestants < 0 ? "termine" : moisRestants <= 2 ? "urgent" : moisRestants <= 4 ? "bientot" : "encours";
      return { id: c.id, nom: c.nom, prix: Number(c.prix) || 0, finKey: keyOfIdx(finIdx), moisRestants, statut };
    })
    .sort((a, b) => a.moisRestants - b.moisRestants);
  const mrrEnJeu = renouvellements.filter((r) => r.statut === "urgent").reduce((s, r) => s + r.prix, 0);

  /* d'où vient le CA : agrégation par source (contrats signés + pipeline pondéré) */
  const parSource = (() => {
    const agg = {};
    const ligne = (src) => { const k = src || "Sans source"; if (!agg[k]) agg[k] = { source: k, caSigne: 0, pipe: 0, nb: 0 }; return agg[k]; };
    clients.forEach((c) => { const l = ligne(c.source); l.caSigne += (c.ech || []).reduce((s, e) => s + e.du, 0); l.nb += 1; });
    prospects.filter((p) => !["signe", "perdu"].includes(p.etape)).forEach((p) => { ligne(p.source).pipe += (Number(p.montant) || 0) * etp(p.etape).proba; });
    return Object.values(agg).filter((l) => l.caSigne > 0 || l.pipe > 0).sort((a, b) => b.caSigne - a.caSigne || b.pipe - a.pipe);
  })();

  const objSim = objCompute(prestas, heures, charges);
  const objectif = objSim.total > 0 ? objSim.total : 60000;
  const contratsReste = resteContrats(prestas, clients);

  /* sources : le catalogue de base + toute source déjà présente en Notion (suivi de contrats) */
  const sourcesList = [...new Set([
    ...SOURCES.filter((s) => s !== "Autre"),
    ...clients.map((c) => c.source).filter(Boolean),
    ...prospects.map((p) => p.source).filter(Boolean),
    "Autre",
  ])];

  /* ---------------- actions (écrivent dans Notion) ---------------- */
  const champsProspect = (p) => ({
    "Client": p.societe || p.nom || "",
    "Statut": "Pipeline",
    "Étape": ETAPE_NAME[p.etape] || "Prospect",
    "Type": p.type ? TYPE_NAME[p.type] : null,
    "Contact": p.nom || "",
    "Montant HT": p.montant === "" || p.montant == null ? null : Number(p.montant),
    "Offre": p.offre || "",
    "Source": p.source || null,
    "Relance": p.relance || null,
    "Notes": p.note || "",
  });
  const majProspect = (p) => ecrire(
    () => (isNotionId(p.id) ? apiUpdate(p.id, champsProspect(p)) : apiCreate(champsProspect(p))),
    "Enregistrement du prospect"
  );
  const bougerEtape = (p, dir) => {
    const ordre = ["prospect", "contacte", "diagnostic", "propale", "signe"];
    const i = ordre.indexOf(p.etape);
    if (dir > 0 && p.etape === "propale") { setSignature({ ...p }); return; }
    const ni = Math.max(0, Math.min(ordre.length - 1, i + dir));
    ecrire(() => apiUpdate(p.id, { "Étape": ETAPE_NAME[ordre[ni]] }), "Déplacement de l'étape");
  };
  const marquerPerdu = (p) => ecrire(() => apiUpdate(p.id, { "Étape": "Perdu" }), "Mise à jour");

  const champsContrat = (d) => ({
    "Client": d.nom,
    "Type": TYPE_NAME[d.type],
    "Montant HT": Number(d.prix),
    "Début": d.debut + "-01",
    "Durée mois": Number(d.duree) || 1,
    "Statut": "Signé",
    "Source": d.source || null,
    "Nombre": Number(d.nombre) || 1,
  });
  const confirmerSignature = (data) => {
    const base = { ...champsContrat(data), "Étape": "Signé" };
    ecrire(
      () => (signature && isNotionId(signature.id) ? apiUpdate(signature.id, base) : apiCreate(base)),
      "Signature"
    );
    setSignature(null);
  };
  const majClient = (c) => ecrire(
    () => (isNotionId(c.id) ? apiUpdate(c.id, champsContrat(c)) : apiCreate(champsContrat(c))),
    "Enregistrement du contrat"
  );

  if (chargement)
    return <div style={{ ...sans, background: S.cream, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: S.soft }}>Lecture de Notion…</div>;

  const NAV = [
    { id: "pilotage", nom: "Pilotage", ic: <TrendingUp size={16} /> },
    { id: "crm", nom: "CRM", ic: <Users size={16} /> },
    { id: "tunnel", nom: "Tunnel", ic: <Funnel size={16} /> },
    { id: "contrats", nom: "Contrats", ic: <FileText size={16} /> },
    { id: "objectifs", nom: "Objectifs", ic: <Target size={16} /> },
  ];

  return (
    <div style={{ ...sans, background: S.cream, minHeight: "100vh", paddingBottom: 104 }}>
      <style>{`input,select,button,textarea{font-family:'Raleway',system-ui,sans-serif}
        input[type=number]{-moz-appearance:textfield}
        input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
        .wrap::-webkit-scrollbar{height:9px}.wrap::-webkit-scrollbar-thumb{background:${S.line};border-radius:9px}
        .cel:hover{background:#FFF9EE!important;cursor:cell}
        .pagenav{position:sticky;top:0;z-index:40;background:${S.panel};display:flex;gap:8px;padding:11px 14px;overflow-x:auto;border-bottom:1px solid ${S.deep}}
        .pagenav a{flex:none;color:#C9BFAE;text-decoration:none;font-size:13px;font-weight:600;padding:9px 15px;border-radius:10px;white-space:nowrap}
        .pagenav a.on{color:${S.cream};background:${S.deep}}`}</style>

      <div className="pagenav">
        <a href="cockpit.html" className="on">Cockpit CA</a>
        <a href="pilotage-live.html">Pilotage</a>
      </div>

      {/* barre titre */}
      <div style={{ padding: "18px 16px 0", maxWidth: 1120, margin: "0 auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
          <div>
            <div style={{ fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: S.deep, fontWeight: 600 }}>
              Poste de pilotage · exercice sept. 2026 → août 2027
            </div>
            <h1 style={{ ...serif, fontSize: 27, fontWeight: 600, margin: "4px 0 2px", color: S.ink }}>Copilote digital</h1>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: S.soft, marginTop: 2 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: live ? S.green : S.gold, display: "inline-block" }} />
              {live ? "Notion en direct · édition synchronisée" : "Notion injoignable"}
            </div>
          </div>
          <button onClick={reload} disabled={occupe}
            style={{ flex: "none", marginTop: 4, border: `1px solid ${S.line}`, background: S.paper, color: S.deep, fontWeight: 600, fontSize: 12, borderRadius: 10, padding: "8px 12px", cursor: occupe ? "default" : "pointer", opacity: occupe ? 0.6 : 1, display: "flex", alignItems: "center", gap: 5 }}>
            <RefreshCw size={13} /> {occupe ? "…" : "Rafraîchir"}
          </button>
        </div>
        {erreur && <div style={{ background: "#F6EDE4", border: `1px solid ${S.rust}`, borderRadius: 10, padding: "8px 12px", fontSize: 12.5, color: S.rust, marginTop: 8 }}>{erreur}</div>}
      </div>

      <div style={{ padding: "20px 18px 0", maxWidth: 1120, margin: "0 auto" }}>
        {vue === "pilotage" && <Pilotage {...{ caSigne, moisSigne, moisContratsActifs, moisNouveaux, cumulSigne, pipePondere, setVue, objectif, contratsReste, renouvellements, mrrEnJeu, parSource }} />}
        {vue === "crm" && <CRM {...{ prospects, setFProspect, bougerEtape, marquerPerdu, pipePondere, pipeBrut }} />}
        {vue === "tunnel" && <Tunnel {...{ tunnels, prospects, clients, caSigne, setFLevier, saveLevier, tunSaveEtat }} />}
        {vue === "contrats" && <Contrats {...{ clients, moisSigne, setFClient, setASupprimer, caSigne }} />}
        {vue === "objectifs" && <Objectifs {...{ prestas, heures, charges, objSim, majPresta, ajouterPresta, supprimerPresta, setHeuresObj, setChargesObj, setConfirmReset, objSaveEtat, caSigne }} />}
      </div>

      {/* barre navigation basse */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: S.panel, borderTop: `1px solid ${S.deep}`, display: "flex", justifyContent: "center", gap: 6, padding: "10px 10px calc(12px + env(safe-area-inset-bottom))", zIndex: 30 }}>
        {NAV.map((n) => (
          <button key={n.id} onClick={() => setVue(n.id)}
            style={{ flex: "1 1 0", maxWidth: 128, background: vue === n.id ? S.deep : "transparent", border: "none", borderRadius: 12, color: vue === n.id ? S.cream : "#C9BFAE", padding: "9px 4px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 600 }}>
            {n.ic}{n.nom}
          </button>
        ))}
      </div>

      {/* modales */}
      {fProspect !== null && <FicheProspect p={fProspect} sourcesList={sourcesList} onClose={() => setFProspect(null)} onSave={(p) => { majProspect(p); setFProspect(null); }} onDelete={(id) => { if (isNotionId(id)) ecrire(() => apiArchive(id), "Suppression"); setFProspect(null); }} />}
      {signature && <FicheSignature p={signature} onClose={() => setSignature(null)} onConfirm={confirmerSignature} />}
      {fClient && <FicheClient c={fClient} sourcesList={sourcesList} onClose={() => setFClient(null)} onSave={(c) => { majClient(c); setFClient(null); }} onDelete={(c) => { setFClient(null); setASupprimer(c); }} />}
      {fLevier && <FicheLevier ctx={fLevier} onClose={() => setFLevier(null)} onSave={(lev) => { saveLevier(fLevier.offre, fLevier.phase, lev); setFLevier(null); }} onDelete={(id) => { deleteLevier(fLevier.offre, fLevier.phase, id); setFLevier(null); }} />}
      {aSupprimer && (
        <Modal onClose={() => setASupprimer(null)}>
          <div style={{ ...serif, fontSize: 19, fontWeight: 600, color: S.ink }}>Supprimer {aSupprimer.nom} ?</div>
          <p style={{ fontSize: 13, color: S.soft, marginTop: 6 }}>Le contrat sera archivé dans Notion (récupérable depuis la corbeille Notion).</p>
          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            <button onClick={() => setASupprimer(null)} style={btnSec}>Annuler</button>
            <button onClick={() => { if (isNotionId(aSupprimer.id)) ecrire(() => apiArchive(aSupprimer.id), "Suppression"); setASupprimer(null); }} style={{ ...btnSec, background: S.rust, color: "#fff", border: "none" }}>Archiver</button>
          </div>
        </Modal>
      )}
      {confirmReset && (
        <Modal onClose={() => setConfirmReset(false)}>
          <div style={{ ...serif, fontSize: 19, fontWeight: 600, color: S.ink }}>Revenir aux prix validés ?</div>
          <p style={{ fontSize: 13, color: S.soft, marginTop: 6 }}>Tes prestations seront remplacées par les paliers validés (350 / 525 / 850 €, site 1 900 €, formation 900 €). Enregistré dans Notion.</p>
          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            <button onClick={() => setConfirmReset(false)} style={btnSec}>Annuler</button>
            <button onClick={reinitObjectifs} style={{ ...btnSec, background: S.panel, color: S.cream, border: "none" }}>Réinitialiser</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= VUE PILOTAGE ================= */
function Pilotage({ caSigne, moisSigne, moisContratsActifs, moisNouveaux, cumulSigne, pipePondere, setVue, objectif, contratsReste, renouvellements, mrrEnJeu, parSource }) {
  const projete = caSigne + pipePondere;

  /* rythme : où devrais-tu en être aujourd'hui vs objectif (cible linéaire sur 12 mois) */
  const nowP = new Date();
  const idxNowP = (nowP.getFullYear() - 2026) * 12 + (nowP.getMonth() + 1 - 9);
  const moisEcoules = Math.max(0, Math.min(12, idxNowP + 1));
  const cibleADate = objectif * moisEcoules / 12;
  const ecart = caSigne - cibleADate; // >0 avance, <0 retard
  const cibleMensuelle = objectif / 12;

  /* ---- pilotage mensuel : focus du mois courant ---- */
  const iNow = idxNowP;
  const enCours = iNow >= 0 && iNow <= 11;
  const avantExercice = iNow < 0;
  const apresExercice = iNow > 11;
  const iFocus = Math.max(0, Math.min(11, iNow));
  const moisNom = MOIS[FY[iFocus].m - 1];
  const duFocus = moisSigne[iFocus];
  const actifsFocus = moisContratsActifs[iFocus];
  const nouveauxFocus = moisNouveaux[iFocus];
  const statutFocus = avantExercice ? "à venir" : apresExercice ? "clôturé" : "en cours";
  const maxMois = Math.max(1, ...moisSigne, cibleMensuelle);

  /* ---- sablier de l'exercice (sept. 2026 → août 2027) ---- */
  const debutEx = new Date(2026, 8, 1);   // 1ᵉʳ sept. 2026
  const finEx = new Date(2027, 8, 1);     // 1ᵉʳ sept. 2027 (borne de fin)
  const msJour = 86400000;
  const joursAvantDebut = Math.max(0, Math.ceil((debutEx - nowP) / msJour));
  const joursAvantFin = Math.max(0, Math.ceil((finEx - nowP) / msJour));
  const dureeTot = finEx - debutEx;
  const pctTemps = Math.round(Math.min(100, Math.max(0, (nowP - debutEx) / dureeTot)) * 100);
  const moisRestants = Math.max(1, 12 - iNow);
  const parMoisPourCap = contratsReste.reste > 0 ? Math.ceil(contratsReste.reste / moisRestants) : 0;

  return (
    <div>
      <div style={{ background: S.panel, borderRadius: 16, padding: "20px 18px", color: S.cream }}>
        <div style={{ fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: S.gold, fontWeight: 600 }}>CA signé sur l'exercice</div>
        <div style={{ ...serif, fontSize: 40, fontWeight: 600, lineHeight: 1, marginTop: 4 }}>
          {court(caSigne)}<span style={{ fontSize: 15, color: S.gold, marginLeft: 5 }}>€ HT</span>
        </div>
        <div style={{ fontSize: 12.5, color: "#C9BFAE", marginTop: 6 }}>
          pipeline pondéré {court(pipePondere)} € · {contratsReste.signe} contrat{contratsReste.signe > 1 ? "s" : ""} signé{contratsReste.signe > 1 ? "s" : ""}
        </div>
        {[60000, 80000].map((t) => (
          <div key={t} style={{ marginTop: 15 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#C9BFAE", marginBottom: 5 }}>
              <span>Objectif {t / 1000}k</span>
              <span style={{ color: caSigne >= t ? "#9DBF9D" : "#E0A277", fontWeight: 600 }}>{caSigne >= t ? "atteint" : `manque ${court(t - caSigne)} €`}</span>
            </div>
            <div style={{ height: 10, background: "#3a352e", borderRadius: 6, overflow: "hidden", position: "relative" }}>
              <div style={{ height: "100%", width: `${Math.min(100, (caSigne / t) * 100)}%`, background: `linear-gradient(90deg,${S.deep},${S.gold})`, borderRadius: 6 }} />
              {projete > caSigne && <div style={{ position: "absolute", top: 0, height: "100%", left: `${Math.min(100, (caSigne / t) * 100)}%`, width: `${Math.min(100 - (caSigne / t) * 100, ((projete - caSigne) / t) * 100)}%`, background: "repeating-linear-gradient(45deg,#5d564c,#5d564c 4px,transparent 4px,transparent 8px)" }} />}
            </div>
          </div>
        ))}
        <div style={{ fontSize: 11, color: "#8d857a", marginTop: 8 }}>La zone hachurée montre le pipeline pondéré ajouté au signé.</div>
      </div>

      {/* reste à faire EN NOMBRE DE CONTRATS : objectif vs signé, par offre */}
      <div style={{ background: S.paper, border: `1px solid ${S.line}`, borderLeft: `4px solid ${S.deep}`, borderRadius: 14, padding: "15px 17px", marginTop: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6, marginBottom: 4 }}>
          <div style={{ ...serif, fontSize: 18, fontWeight: 600, color: S.ink }}>Reste à faire — en contrats</div>
          <button onClick={() => setVue("objectifs")} style={{ background: "transparent", border: "none", color: S.deep, fontSize: 11.5, fontWeight: 600, cursor: "pointer", padding: 0 }}>Objectifs →</button>
        </div>
        {contratsReste.objectif <= 0 ? (
          <p style={{ fontSize: 13, color: S.soft, lineHeight: 1.6, margin: "4px 0 0" }}>Renseigne les quantités visées par offre dans l'onglet <b style={{ color: S.ink }}>Objectifs</b> pour voir ton reste à faire en nombre de contrats.</p>
        ) : (
          <>
            <div style={{ fontSize: 13.5, color: S.soft, lineHeight: 1.7 }}>
              Objectif : <b style={{ color: S.ink }}>{contratsReste.objectif} contrats</b> · déjà signés : <b style={{ color: S.ink }}>{contratsReste.signe}</b> →{" "}
              {contratsReste.reste <= 0
                ? <b style={{ color: S.green }}>objectif atteint 🎉</b>
                : <b style={{ color: S.rust }}>reste {contratsReste.reste} contrat{contratsReste.reste > 1 ? "s" : ""} à signer</b>}.
            </div>
            <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 9 }}>
              {contratsReste.lignes.map((l) => {
                const pct = l.objectif > 0 ? Math.min(100, (l.signe / l.objectif) * 100) : 100;
                const fait = l.reste <= 0;
                return (
                  <div key={l.id}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", fontSize: 12.5, marginBottom: 4 }}>
                      <span style={{ color: S.soft, fontWeight: 600 }}>{l.nom}</span>
                      <span style={{ color: fait ? S.green : S.ink, fontWeight: 600 }}>
                        {l.signe} / {l.objectif}
                        {!fait && <span style={{ color: S.rust }}> · reste {l.reste}</span>}
                      </span>
                    </div>
                    <div style={{ height: 8, background: S.grid, borderRadius: 5, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${pct}%`, background: fait ? "linear-gradient(90deg,#7DA07D,#5B7A5B)" : `linear-gradient(90deg,${S.deep},${S.gold})`, borderRadius: 5 }} />
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{ fontSize: 11, color: S.soft, opacity: 0.85, marginTop: 10 }}>Objectif = quantités visées dans l'onglet Objectifs. Signés = contrats déjà enregistrés (BNI compté à l'unité).</div>
          </>
        )}
      </div>

      {/* rythme mensuel : dois-je accélérer ? */}
      <div style={{ background: S.panel, borderRadius: 14, padding: "15px 16px", marginTop: 12, color: S.cream }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
          <div style={{ ...serif, fontSize: 17, fontWeight: 600 }}>Rythme sur l'objectif</div>
          <div style={{ fontSize: 12.5, fontWeight: 600, color: ecart >= 0 ? "#9DBF9D" : "#E0A277" }}>
            {moisEcoules === 0 ? "exercice pas encore commencé" : ecart >= 0 ? `en avance de ${court(ecart)} €` : `en retard de ${court(-ecart)} € → accélère`}
          </div>
        </div>
        <div style={{ fontSize: 12, color: "#C9BFAE", marginTop: 4 }}>
          À ce stade tu devrais avoir signé <b style={{ color: S.cream }}>{court(cibleADate)} €</b> ({moisEcoules}/12 de l'objectif). Cible : <b style={{ color: S.cream }}>{court(cibleMensuelle)} € / mois</b>.
        </div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 60, marginTop: 12 }}>
          {moisSigne.map((v, i) => {
            const cumul = cumulSigne[i];
            const cible = objectif * (i + 1) / 12;
            const ok = cumul >= cible;
            const passe = i < moisEcoules;
            const h = Math.min(100, (cumul / objectif) * 100);
            return (
              <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }} title={`${MOIS[FY[i].m - 1]} : signé cumulé ${court(cumul)} € / cible ${court(cible)} €`}>
                <div style={{ width: "100%", position: "relative", height: 44, background: "#3a352e", borderRadius: 3, overflow: "hidden" }}>
                  <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: `${h}%`, background: ok ? "linear-gradient(180deg,#7DA07D,#5B7A5B)" : "linear-gradient(180deg,#C99B6E,#A9683F)" }} />
                  <div style={{ position: "absolute", left: 0, right: 0, bottom: `${Math.min(100, ((i + 1) / 12) * 100)}%`, height: 2, background: "#C9BFAE", opacity: 0.7 }} />
                </div>
                <div style={{ fontSize: 8, color: passe ? "#C9BFAE" : "#6d655a" }}>{MOIS[FY[i].m - 1].slice(0, 1).toUpperCase()}</div>
              </div>
            );
          })}
        </div>
        <div style={{ fontSize: 10.5, color: "#8d857a", marginTop: 7 }}>Chaque barre = CA signé cumulé à ce mois. Barre <span style={{ color: "#9DBF9D" }}>verte</span> = au-dessus de la cible, <span style={{ color: "#E0A277" }}>orange</span> = en dessous. Le trait clair = cible cumulée.</div>
      </div>

      {/* focus du mois courant : contrats (sans notion de paiement) */}
      <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>
        {[
          { l: `${moisNom} · CA du mois`, v: eur(duFocus), s: `mois ${statutFocus}` },
          { l: `${moisNom} · contrats actifs`, v: actifsFocus, s: "en cours ce mois" },
          { l: `${moisNom} · nouveaux`, v: nouveauxFocus, s: "démarrages du mois" },
        ].map((k, i) => (
          <button key={i} onClick={() => setVue("contrats")} style={{ flex: "1 1 150px", textAlign: "left", background: S.paper, border: `1px solid ${S.line}`, borderRadius: 12, padding: "11px 13px", cursor: "pointer" }}>
            <div style={{ fontSize: 10, letterSpacing: "0.05em", textTransform: "uppercase", color: S.deep, fontWeight: 600 }}>{k.l}</div>
            <div style={{ ...serif, fontSize: 21, color: S.ink, marginTop: 2 }}>{k.v}</div>
            <div style={{ fontSize: 11.5, color: S.soft }}>{k.s}</div>
          </button>
        ))}
      </div>

      {/* graphe mensuel : CA signé par mois (contrats), cible mensuelle, mois courant surligné */}
      <div style={{ background: S.paper, border: `1px solid ${S.line}`, borderRadius: 14, padding: "14px 14px 12px", marginTop: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6, marginBottom: 4 }}>
          <div style={{ ...serif, fontSize: 16, fontWeight: 600, color: S.ink }}>Le CA des contrats, mois par mois</div>
          <div style={{ fontSize: 10.5, color: S.soft }}>trait = cible {court(cibleMensuelle)} € / mois</div>
        </div>
        <div style={{ position: "relative", height: 112, marginTop: 10 }}>
          <div style={{ position: "absolute", left: 0, right: 0, bottom: `${(cibleMensuelle / maxMois) * 112}px`, borderTop: `1px dashed ${S.deep}`, opacity: 0.55, zIndex: 3 }} />
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "flex-end", gap: 3 }}>
            {FY.map((o, i) => {
              const du = moisSigne[i];
              const cur = i === iFocus && enCours;
              return (
                <div key={i} style={{ flex: 1, height: "100%", display: "flex", alignItems: "flex-end", justifyContent: "center", background: cur ? "rgba(176,141,87,0.12)" : "transparent", borderRadius: 5, paddingTop: 2 }} title={`${MOIS[o.m - 1]} : ${eur(du)}`}>
                  <div style={{ width: "62%", height: `${(du / maxMois) * 112}px`, minHeight: du ? 2 : 0, background: `linear-gradient(180deg,${S.gold},${S.deep})`, borderRadius: "2px 2px 0 0" }} />
                </div>
              );
            })}
          </div>
        </div>
        <div style={{ display: "flex", gap: 3, marginTop: 3 }}>
          {FY.map((o, i) => {
            const cur = i === iFocus && enCours;
            return <div key={i} style={{ flex: 1, textAlign: "center", fontSize: 8.5, color: cur ? S.deep : S.soft, fontWeight: cur ? 700 : 400 }}>{MOIS[o.m - 1].slice(0, 1).toUpperCase()}</div>;
          })}
        </div>
        <div style={{ fontSize: 11, color: S.rust, marginTop: 9, display: "flex", alignItems: "center", gap: 5 }}>
          <AlertTriangle size={12} /> La falaise après décembre, c'est ton vrai chantier : renouvellement et acquisition.
        </div>
      </div>

      {/* radar des renouvellements : combler la falaise avant qu'elle arrive */}
      <div style={{ background: S.paper, border: `1px solid ${S.line}`, borderLeft: `4px solid ${mrrEnJeu > 0 ? S.rust : S.line}`, borderRadius: 14, padding: "15px 17px", marginTop: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6, marginBottom: 4 }}>
          <div style={{ ...serif, fontSize: 18, fontWeight: 600, color: S.ink }}>Radar des renouvellements</div>
          <button onClick={() => setVue("contrats")} style={{ background: "transparent", border: "none", color: S.deep, fontSize: 11.5, fontWeight: 600, cursor: "pointer", padding: 0 }}>Contrats →</button>
        </div>
        {renouvellements.length === 0 ? (
          <p style={{ fontSize: 13, color: S.soft, lineHeight: 1.6, margin: "4px 0 0" }}>Aucun contrat récurrent pour l'instant — dès que tu en signes un, sa date de fin apparaîtra ici avec une alerte 2 mois avant.</p>
        ) : (
          <>
            <div style={{ fontSize: 13.5, color: S.soft, lineHeight: 1.6, marginBottom: 10 }}>
              {mrrEnJeu > 0
                ? <><b style={{ color: S.rust }}>{renouvellements.filter((r) => r.statut === "urgent").length} contrat{renouvellements.filter((r) => r.statut === "urgent").length > 1 ? "s" : ""}</b> arrive{renouvellements.filter((r) => r.statut === "urgent").length > 1 ? "nt" : ""} à échéance sous 2 mois — <b style={{ color: S.rust }}>{court(mrrEnJeu)} € / mois</b> en jeu. Propose le renouvellement maintenant.</>
                : <span style={{ color: S.green, fontWeight: 600 }}>Aucun renouvellement urgent 👌</span>}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
              {renouvellements.map((r) => {
                const chip = {
                  urgent: { txt: "à renouveler", bg: "#F6E7DE", col: S.rust },
                  bientot: { txt: "à préparer", bg: "#F3EAD9", col: S.deep },
                  encours: { txt: "en cours", bg: "#EDF1EC", col: S.green },
                  termine: { txt: "terminé — relancer ?", bg: "#ECE8E1", col: S.soft },
                }[r.statut];
                return (
                  <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, background: "#fff", border: `1px solid ${S.line}`, borderRadius: 10, padding: "8px 11px" }}>
                    <div style={{ minWidth: 0 }}>
                      <span style={{ ...serif, fontSize: 14.5, fontWeight: 600, color: S.ink }}>{r.nom}</span>
                      <span style={{ fontSize: 12, color: S.soft }}> · {court(r.prix)} €/mois</span>
                      <div style={{ fontSize: 11.5, color: S.soft }}>{r.statut === "termine" ? "s'est terminé" : "se termine"} {labKey(r.finKey)}{r.statut !== "termine" && r.moisRestants >= 0 ? ` · dans ${r.moisRestants === 0 ? "moins d'un mois" : r.moisRestants + " mois"}` : ""}</div>
                    </div>
                    <span style={{ flex: "none", fontSize: 10.5, fontWeight: 700, color: chip.col, background: chip.bg, padding: "4px 9px", borderRadius: 10, whiteSpace: "nowrap" }}>{chip.txt}</span>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* d'où vient le CA : sources qui rapportent (signé + pipeline pondéré) */}
      <div style={{ background: S.paper, border: `1px solid ${S.line}`, borderRadius: 14, padding: "15px 17px", marginTop: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6, marginBottom: 4 }}>
          <div style={{ ...serif, fontSize: 18, fontWeight: 600, color: S.ink }}>D'où vient le CA</div>
          <div style={{ display: "flex", gap: 12, fontSize: 10.5, color: S.soft }}>
            <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: S.gold }} /> signé</span>
            <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: "repeating-linear-gradient(45deg,#B8A88E,#B8A88E 2px,transparent 2px,transparent 4px)", border: `1px solid ${S.line}` }} /> pipeline pondéré</span>
          </div>
        </div>
        {parSource.length === 0 ? (
          <p style={{ fontSize: 13, color: S.soft, lineHeight: 1.6, margin: "4px 0 0" }}>Renseigne la <b style={{ color: S.ink }}>source</b> sur tes contrats et prospects (BNI, LinkedIn, reco…) pour voir quelle source ramène du CA.</p>
        ) : (
          <>
            <div style={{ display: "flex", flexDirection: "column", gap: 9, marginTop: 6 }}>
              {(() => {
                const maxSrc = Math.max(1, ...parSource.map((l) => l.caSigne + l.pipe));
                return parSource.map((l) => (
                  <div key={l.source}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", fontSize: 12.5, marginBottom: 4 }}>
                      <span style={{ color: S.soft, fontWeight: 600 }}>{l.source}{l.nb > 0 && <span style={{ opacity: 0.7, fontWeight: 400 }}> · {l.nb} contrat{l.nb > 1 ? "s" : ""}</span>}</span>
                      <span style={{ color: S.ink, fontWeight: 600 }}>{court(l.caSigne)} €{l.pipe > 0 && <span style={{ color: S.soft, fontWeight: 400 }}> + {court(l.pipe)} € pond.</span>}</span>
                    </div>
                    <div style={{ height: 9, background: S.grid, borderRadius: 5, overflow: "hidden", display: "flex" }}>
                      <div style={{ height: "100%", width: `${(l.caSigne / maxSrc) * 100}%`, background: `linear-gradient(90deg,${S.deep},${S.gold})` }} />
                      <div style={{ height: "100%", width: `${(l.pipe / maxSrc) * 100}%`, background: "repeating-linear-gradient(45deg,#B8A88E,#B8A88E 3px,transparent 3px,transparent 6px)" }} />
                    </div>
                  </div>
                ));
              })()}
            </div>
            <div style={{ fontSize: 11, color: S.soft, opacity: 0.85, marginTop: 10 }}>Ta meilleure source mérite ton temps de prospection — la barre pleine est du CA signé, la hachure du pipeline pondéré par probabilité.</div>
          </>
        )}
      </div>

      {/* ✦ le sablier de l'exercice — compte à rebours + timeline */}
      <div style={{ background: S.panel, borderRadius: 16, padding: "18px 18px", marginTop: 12, color: S.cream, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", right: -30, top: -30, width: 130, height: 130, borderRadius: "50%", background: "radial-gradient(circle, rgba(176,141,87,0.18), transparent 70%)" }} />
        <div style={{ fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: S.gold, fontWeight: 600 }}>Le sablier de l'exercice</div>
        {avantExercice ? (
          <>
            <div style={{ ...serif, fontSize: 34, fontWeight: 600, lineHeight: 1.05, marginTop: 6 }}>J‑{joursAvantDebut} <span style={{ fontSize: 14, color: S.gold }}>avant le coup d'envoi</span></div>
            <div style={{ fontSize: 12.5, color: "#C9BFAE", marginTop: 6 }}>L'exercice s'ouvre le 1ᵉʳ septembre 2026. {contratsReste.objectif > 0 ? <>Ligne de mire : <b style={{ color: S.cream }}>{contratsReste.objectif} contrats</b> sur l'année.</> : <>Cale d'abord tes cibles dans l'onglet Objectifs.</>}</div>
          </>
        ) : apresExercice ? (
          <>
            <div style={{ ...serif, fontSize: 34, fontWeight: 600, marginTop: 6 }}>Exercice bouclé</div>
            <div style={{ fontSize: 12.5, color: "#C9BFAE", marginTop: 6 }}><b style={{ color: S.cream }}>{court(caSigne)} €</b> signés · <b style={{ color: S.cream }}>{contratsReste.signe} contrats</b> au compteur. Beau chemin — place au prochain exercice.</div>
          </>
        ) : (
          <>
            <div style={{ ...serif, fontSize: 34, fontWeight: 600, lineHeight: 1.05, marginTop: 6 }}>{joursAvantFin} <span style={{ fontSize: 14, color: S.gold }}>jours restants</span></div>
            <div style={{ fontSize: 12.5, color: "#C9BFAE", marginTop: 6 }}>
              {contratsReste.reste > 0
                ? <>Encore <b style={{ color: S.cream }}>{contratsReste.reste} contrat{contratsReste.reste > 1 ? "s" : ""}</b> à signer, soit ~<b style={{ color: S.cream }}>{parMoisPourCap}</b> par mois d'ici la fin pour tenir le cap.</>
                : <>Objectif contrats atteint — continue à signer et à renouveler. 🎯</>}
            </div>
          </>
        )}
        <div style={{ marginTop: 16 }}>
          <div style={{ position: "relative", height: 8, background: "#3a352e", borderRadius: 5 }}>
            <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${pctTemps}%`, background: `linear-gradient(90deg,${S.deep},${S.gold})`, borderRadius: 5 }} />
            <div style={{ position: "absolute", left: `${pctTemps}%`, top: "50%", transform: "translate(-50%,-50%)", width: 12, height: 12, borderRadius: "50%", background: S.cream, border: `2px solid ${S.gold}`, boxShadow: "0 0 0 3px rgba(176,141,87,0.35)" }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9.5, color: "#8d857a", marginTop: 7 }}>
            <span>sept. 26</span><span style={{ color: "#C9BFAE" }}>{pctTemps}% du temps écoulé</span><span>août 27</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================= VUE CRM ================= */
function CRM({ prospects, setFProspect, bougerEtape, marquerPerdu, pipePondere, pipeBrut }) {
  const colonnes = ETAPES.filter((e) => e.id !== "perdu");
  const perdus = prospects.filter((p) => p.etape === "perdu");

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontSize: 12.5, color: S.soft }}>
          Pipeline pondéré <b style={{ color: S.ink }}>{court(pipePondere)} €</b> · brut {court(pipeBrut)} €
        </div>
        <button onClick={() => setFProspect({ id: Date.now(), nom: "", societe: "", etape: "prospect", type: "prog", montant: "", offre: "Visible & Rentable", source: "", relance: "", note: "" })}
          style={{ ...btnAdd, width: "auto", padding: "9px 14px" }}><Plus size={15} /> Prospect</button>
      </div>

      <div className="wrap" style={{ overflowX: "auto", marginTop: 16, paddingBottom: 6 }}>
        <div style={{ display: "flex", gap: 12, minWidth: 900 }}>
          {colonnes.map((col) => {
            const items = prospects.filter((p) => p.etape === col.id);
            return (
              <div key={col.id} style={{ flex: "1 1 0", minWidth: 172, background: S.paper, border: `1px solid ${S.line}`, borderTop: `3px solid ${col.col}`, borderRadius: 12, padding: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "2px 4px 8px" }}>
                  <span style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.03em", textTransform: "uppercase", color: col.col }}>{col.nom}</span>
                  <span style={{ fontSize: 10.5, color: S.soft }}>{items.length}</span>
                </div>
                {items.map((p) => (
                  <div key={p.id} style={{ background: "#fff", border: `1px solid ${S.line}`, borderRadius: 9, padding: "8px 9px", marginBottom: 7 }}>
                    <div onClick={() => setFProspect(p)} style={{ cursor: "pointer" }}>
                      <div style={{ ...serif, fontSize: 14, fontWeight: 600, color: S.ink, lineHeight: 1.2 }}>{p.societe || p.nom || "Sans nom"}</div>
                      {p.nom && p.societe && <div style={{ fontSize: 11, color: S.soft }}>{p.nom}</div>}
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
                        <span style={{ fontSize: 12.5, fontWeight: 600, color: S.deep }}>{p.montant ? eur(p.montant) : "—"}</span>
                        {p.source && <span style={{ fontSize: 9.5, fontWeight: 700, color: S.soft, background: S.cream, padding: "1px 6px", borderRadius: 10 }}>{p.source}</span>}
                      </div>
                    </div>
                    {col.id !== "signe" && (
                      <div style={{ display: "flex", gap: 4, marginTop: 7 }}>
                        <button onClick={() => bougerEtape(p, 1)} title="Étape suivante"
                          style={{ flex: 1, border: "none", background: col.col, color: "#fff", borderRadius: 7, padding: "5px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 3, fontSize: 11, fontWeight: 600 }}>
                          {col.id === "propale" ? <>Signer <Check size={12} /></> : <>Avancer <ArrowRight size={12} /></>}
                        </button>
                        <button onClick={() => marquerPerdu(p)} title="Perdu"
                          style={{ border: `1px solid ${S.line}`, background: "#fff", color: S.rust, borderRadius: 7, padding: "5px 7px", cursor: "pointer" }}><X size={12} /></button>
                      </div>
                    )}
                  </div>
                ))}
                {items.length === 0 && <div style={{ fontSize: 11, color: S.soft, textAlign: "center", padding: "10px 4px", opacity: 0.6 }}>—</div>}
              </div>
            );
          })}
        </div>
      </div>

      {perdus.length > 0 && (
        <div style={{ marginTop: 10, fontSize: 12, color: S.soft }}>
          <b>Perdus :</b> {perdus.map((p) => p.societe || p.nom).join(", ")}
        </div>
      )}
    </div>
  );
}

/* ================= VUE CONTRATS ================= */
function Contrats({ clients, moisSigne, setFClient, setASupprimer, caSigne }) {
  const W = 74, WN = 150;
  const lignes = clients.filter((c) => (c.ech || []).length);
  const th = { position: "sticky", top: 0, background: S.panel, color: S.cream, fontSize: 10, fontWeight: 700, textTransform: "uppercase", padding: "8px 7px", textAlign: "right", whiteSpace: "nowrap" };
  const td = { padding: 0, borderBottom: `1px solid ${S.grid}`, borderRight: `1px solid ${S.grid}`, textAlign: "right", fontSize: 12.5, height: 34 };
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <div style={{ fontSize: 12.5, color: S.soft }}>{clients.length} contrats · {court(caSigne)} € sur l'exercice</div>
        <button onClick={() => setFClient({ id: Date.now(), nom: "", type: "prog", prix: "", debut: FY[0].key, duree: 6, source: "", nombre: 1 })} style={{ ...btnAdd, width: "auto", padding: "9px 14px" }}><Plus size={15} /> Contrat</button>
      </div>

      {/* tableau CA mois par mois */}
      <div style={{ ...serif, fontSize: 16, fontWeight: 600, color: S.ink, margin: "14px 0 6px" }}>Le CA mois par mois</div>
      {lignes.length === 0 ? (
        <p style={{ fontSize: 12.5, color: S.soft }}>Aucun contrat pour l'instant — ajoute-en un pour voir le CA se répartir sur les mois.</p>
      ) : (
        <div className="wrap" style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
          <table style={{ borderCollapse: "separate", borderSpacing: 0, background: S.paper, border: `1px solid ${S.line}`, borderRadius: 12, overflow: "hidden", minWidth: WN + W * 13 + 20 }}>
            <thead>
              <tr>
                <th style={{ ...th, position: "sticky", left: 0, zIndex: 4, textAlign: "left", width: WN, minWidth: WN }}>Contrat</th>
                {FY.map((o) => <th key={o.key} style={{ ...th, width: W, minWidth: W }}>{MOIS[o.m - 1]}<br /><span style={{ color: S.gold }}>{String(o.y).slice(2)}</span></th>)}
                <th style={{ ...th, width: W, minWidth: W, color: S.gold }}>Total</th>
              </tr>
            </thead>
            <tbody>
              {lignes.map((c) => {
                const dansFY = (c.ech || []).reduce((s, e) => s + e.du, 0);
                return (
                  <tr key={c.id}>
                    <td style={{ position: "sticky", left: 0, zIndex: 2, background: S.paper, borderRight: `2px solid ${S.line}`, borderBottom: `1px solid ${S.grid}`, padding: "5px 9px", width: WN, minWidth: WN }}>
                      <div onClick={() => setFClient(c)} title="Modifier ce contrat" style={{ ...serif, fontSize: 13.5, fontWeight: 600, color: S.deep, lineHeight: 1.15, cursor: "pointer", textDecoration: "underline", textDecorationColor: S.line, textUnderlineOffset: 2 }}>{c.nom}</div>
                    </td>
                    {FY.map((o) => {
                      const e = (c.ech || []).find((x) => x.mkey === o.key);
                      return <td key={o.key} style={{ ...td, width: W, minWidth: W, background: e ? "#FFFDF9" : "transparent" }}><div style={{ padding: "0 7px", lineHeight: "33px", color: e ? S.soft : S.line, textAlign: e ? "right" : "center", fontWeight: 600 }}>{e ? court(e.du) : "·"}</div></td>;
                    })}
                    <td style={{ ...td, width: W, minWidth: W, background: "#F6EDE4" }}><div style={{ ...serif, padding: "0 7px", lineHeight: "33px", fontSize: 13, fontWeight: 600, color: S.deep }}>{court(dansFY)}</div></td>
                  </tr>
                );
              })}
              <tr>
                <td style={{ position: "sticky", left: 0, zIndex: 2, background: S.panel, borderRight: `1px solid #3a352e`, padding: "6px 9px" }}>
                  <span style={{ ...serif, fontSize: 13.5, fontWeight: 600, color: S.cream }}>CA dû</span>
                </td>
                {moisSigne.map((v, i) => <td key={i} style={{ ...td, background: S.panel, borderRight: `1px solid #3a352e` }}><div style={{ ...serif, padding: "0 7px", lineHeight: "33px", fontSize: 13, color: v ? S.cream : "#5d564c" }}>{v ? court(v) : "·"}</div></td>)}
                <td style={{ ...td, background: S.deep }}><div style={{ ...serif, padding: "0 7px", lineHeight: "33px", fontSize: 13, fontWeight: 700, color: S.cream }}>{court(caSigne)}</div></td>
              </tr>
              <tr>
                <td style={{ position: "sticky", left: 0, zIndex: 2, background: "#F6EDE4", borderRight: `2px solid ${S.line}`, padding: "6px 9px" }}>
                  <span style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", color: S.deep }}>TVA estim. 20 %</span>
                </td>
                {moisSigne.map((v, i) => { const t = v * TVA; return <td key={i} style={{ ...td, background: "#F6EDE4" }}><div style={{ padding: "0 7px", lineHeight: "33px", fontSize: 12.5, fontWeight: 600, color: t ? S.deep : S.line }}>{t ? court(t) : "·"}</div></td>; })}
                <td style={{ ...td, background: "#EFE2CF" }}><div style={{ ...serif, padding: "0 7px", lineHeight: "33px", fontSize: 13, fontWeight: 700, color: S.deep }}>{court(caSigne * TVA)}</div></td>
              </tr>
            </tbody>
          </table>
        </div>
      )}
      <p style={{ fontSize: 11, color: S.soft, marginTop: 7 }}>Touche un <b style={{ color: S.deep }}>nom</b> pour modifier le contrat. Montants en € HT. <b style={{ color: S.deep }}>TVA estim.</b> = 20 % du CA dû du mois.</p>

      <div style={{ ...serif, fontSize: 16, fontWeight: 600, color: S.ink, margin: "20px 0 2px" }}>Détail des contrats</div>
      {clients.map((c) => {
        const dansFY = (c.ech || []).reduce((s, e) => s + e.du, 0);
        const t = est(c.type);
        return (
          <div key={c.id} onClick={() => setFClient(c)} style={{ background: S.paper, border: `1px solid ${S.line}`, borderLeft: `4px solid ${t.rec ? S.deep : S.gold}`, borderRadius: 12, padding: "12px 14px", marginTop: 9, cursor: "pointer" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
              <div>
                <div style={{ ...serif, fontSize: 16.5, fontWeight: 600, color: S.ink }}>{c.nom}</div>
                <div style={{ fontSize: 12, color: S.soft, marginTop: 1 }}>{t.nom} · {eur(c.prix)}{c.type === "bni" ? ` × ${c.nombre}` : t.rec ? `/mois × ${c.duree}` : ""} · {c.type === "bni" ? "commission" : t.rec ? "démarre" : "signé"} {labKey(c.debut)}</div>
              </div>
              <button onClick={(e) => { e.stopPropagation(); setASupprimer(c); }} style={{ ...btnIcon }}><Trash2 size={14} /></button>
            </div>
            <div style={{ display: "flex", gap: 16, marginTop: 9, paddingTop: 9, borderTop: `1px dashed ${S.line}`, fontSize: 12, flexWrap: "wrap" }}>
              <div><span style={{ color: S.soft }}>Dans l'exercice </span><b style={{ ...serif, fontSize: 15 }}>{eur(dansFY)}</b></div>
              <div><span style={{ color: S.soft }}>{est(c.type).rec ? `${c.duree} mois` : c.type === "bni" ? `${c.nombre} unité${c.nombre > 1 ? "s" : ""}` : "ponctuel"} </span><b style={{ ...serif, fontSize: 15, color: S.deep }}>{labKey(c.debut)}</b></div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ================= VUE TUNNEL (acquisition par offre) ================= */
const TUN_STATUTS = [
  { id: "idee", txt: "💡 idée", bg: "#EFEAE0", col: "#514B42" },
  { id: "encours", txt: "🔥 en cours", bg: "#F3EAD9", col: "#8C6D3F" },
  { id: "fait", txt: "✅ fait", bg: "#EDF1EC", col: "#5B7A5B" },
];
const tunStatut = (l) => TUN_STATUTS.find((s) => s.id === (l.statut || "idee")) || TUN_STATUTS[0];
const TUN_STATUT_NEXT = { idee: "encours", encours: "fait", fait: "idee" };
/* pont plan d'action -> étapes réelles du CRM */
const TUN_PONT = {
  attirer: { lab: "prospect entrant", et: ["prospect"] },
  engager: { lab: "contacté", et: ["contacte"] },
  convertir: { lab: "en diagnostic / propale", et: ["diagnostic", "propale"] },
  closer: { lab: "signé", et: null /* = contrats */ },
};

function Tunnel({ tunnels, prospects, clients, caSigne, setFLevier, saveLevier, tunSaveEtat }) {
  const [offre, setOffre] = useState(TUN_OFFRES[0].id);
  const etatTxt = { "en cours": "enregistrement…", ok: "enregistré dans Notion", err: "échec enregistrement" };
  const t = tunnels[offre] || {};

  /* ---- étage 1 : le tunnel réel (toutes offres), calculé depuis le CRM ---- */
  const actifs = prospects.filter((p) => !["signe", "perdu"].includes(p.etape));
  const perdus = prospects.filter((p) => p.etape === "perdu").length;
  const funnel = [
    ...ETAPES.filter((e) => !["signe", "perdu"].includes(e.id)).map((e) => {
      const ps = actifs.filter((p) => p.etape === e.id);
      return { id: e.id, nom: e.nom, col: e.col, n: ps.length, mnt: ps.reduce((s, p) => s + (Number(p.montant) || 0) * e.proba, 0) };
    }),
    { id: "signe", nom: "Signé", col: "#5B7A5B", n: clients.length, mnt: caSigne },
  ];
  const maxN = Math.max(1, ...funnel.map((f) => f.n));
  const closing = clients.length + perdus > 0 ? Math.round((clients.length / (clients.length + perdus)) * 100) : null;

  /* comptes réels par offre sélectionnée, pour le pont */
  const reelPont = (phId) => {
    const p = TUN_PONT[phId];
    if (!p.et) return clients.filter((c) => c.type === offre).length;
    return actifs.filter((x) => x.type === offre && p.et.includes(x.etape)).length;
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
        <div>
          <div style={{ fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: S.deep, fontWeight: 600 }}>Tunnels d'acquisition</div>
          <h2 style={{ ...serif, fontSize: 22, fontWeight: 600, color: S.ink, margin: "3px 0 0" }}>Comment aller chercher les contrats</h2>
        </div>
        {tunSaveEtat && <span style={{ fontSize: 11.5, color: tunSaveEtat === "err" ? S.rust : S.soft }}>{etatTxt[tunSaveEtat]}</span>}
      </div>

      {/* ---- le tunnel réel ---- */}
      <div style={{ background: S.panel, borderRadius: 14, padding: "15px 16px", marginTop: 12, color: S.cream }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
          <div style={{ ...serif, fontSize: 17, fontWeight: 600 }}>Ton tunnel réel, aujourd'hui</div>
          <div style={{ fontSize: 11.5, color: "#C9BFAE" }}>
            {closing !== null ? <>taux de closing <b style={{ color: closing >= 50 ? "#9DBF9D" : "#E0A277" }}>{closing}%</b> · {perdus} perdu{perdus > 1 ? "s" : ""}</> : "pas encore de dossier clos"}
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 11 }}>
          {funnel.map((f) => (
            <div key={f.id} style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ flex: "none", width: 76, fontSize: 10.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.03em", color: f.col, textAlign: "right" }}>{f.nom}</span>
              <div style={{ flex: 1, height: 22, background: "#3a352e", borderRadius: 6, overflow: "hidden", position: "relative" }}>
                <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${(f.n / maxN) * 100}%`, background: `linear-gradient(90deg, ${f.col}66, ${f.col})`, borderRadius: 6, transition: "width .3s" }} />
                <span style={{ position: "absolute", left: 8, top: 0, lineHeight: "22px", fontSize: 11.5, fontWeight: 700, color: S.cream }}>{f.n}</span>
                {f.mnt > 0 && <span style={{ position: "absolute", right: 8, top: 0, lineHeight: "22px", fontSize: 10.5, color: "#C9BFAE" }}>{court(f.mnt)} €{f.id !== "signe" ? " pond." : ""}</span>}
              </div>
            </div>
          ))}
        </div>
        <div style={{ fontSize: 10.5, color: "#8d857a", marginTop: 8 }}>Calculé en direct depuis ton CRM et tes contrats — l'étage le plus vide, c'est là que ton plan d'action doit pousser.</div>
      </div>

      {/* ---- le plan d'action, par offre ---- */}
      <p style={{ fontSize: 12.5, color: S.soft, marginTop: 16, marginBottom: 0 }}>Le plan d'action par offre. Tape la pastille de statut d'une action pour la faire avancer : 💡 → 🔥 → ✅. Sauvegarde auto dans Notion.</p>
      <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
        {TUN_OFFRES.map((of) => (
          <button key={of.id} onClick={() => setOffre(of.id)} style={{ flex: "1 1 auto", padding: "9px 13px", borderRadius: 10, fontSize: 12.5, fontWeight: 600, cursor: "pointer", border: `1px solid ${offre === of.id ? S.deep : S.line}`, background: offre === of.id ? S.deep : "#fff", color: offre === of.id ? S.cream : S.soft }}>{of.nom}</button>
        ))}
      </div>

      <div className="wrap" style={{ overflowX: "auto", marginTop: 14, paddingBottom: 6 }}>
        <div style={{ display: "flex", gap: 12, minWidth: 920 }}>
          {TUN_PHASES.map((ph, pi) => {
            const brut = t[ph.id] || [];
            const items = [...brut.filter((l) => (l.statut || "idee") !== "fait"), ...brut.filter((l) => (l.statut || "idee") === "fait")];
            const enCours = brut.filter((l) => l.statut === "encours").length;
            const reel = reelPont(ph.id);
            const mort = reel === 0 && brut.filter((l) => (l.statut || "idee") !== "fait").length === 0;
            return (
              <div key={ph.id} style={{ flex: "1 1 0", minWidth: 200, background: S.paper, border: `1px solid ${mort ? S.rust : S.line}`, borderTop: `3px solid ${ph.col}`, borderRadius: 12, padding: 10 }}>
                <div style={{ padding: "2px 4px 8px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                    <span style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.03em", textTransform: "uppercase", color: ph.col }}>{pi + 1}. {ph.nom}</span>
                    <span style={{ fontSize: 10.5, color: enCours > 0 ? S.deep : S.soft, fontWeight: enCours > 0 ? 700 : 400 }}>{enCours > 0 ? `${enCours} en cours` : brut.length}</span>
                  </div>
                  <div style={{ fontSize: 10.5, color: S.soft, marginTop: 1 }}>{ph.desc}</div>
                  <div style={{ marginTop: 5, fontSize: 10.5, fontWeight: 700, color: mort ? S.rust : reel > 0 ? S.green : S.soft, background: mort ? "#F6E7DE" : reel > 0 ? "#EDF1EC" : "#EFEAE0", borderRadius: 8, padding: "3px 8px", display: "inline-block" }}>
                    {mort ? "zone morte — pousse ici" : `réel : ${reel} ${TUN_PONT[ph.id].lab}${reel > 1 ? "s" : ""}`}
                  </div>
                </div>
                {items.map((l) => {
                  const st = tunStatut(l);
                  const fait = st.id === "fait";
                  return (
                    <div key={l.id} onClick={() => setFLevier({ offre, phase: ph.id, levier: l })} style={{ background: "#fff", border: `1px solid ${S.line}`, borderRadius: 9, padding: "8px 9px", marginBottom: 7, cursor: "pointer", opacity: fait ? 0.55 : 1 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 6 }}>
                        <div style={{ ...serif, fontSize: 14, fontWeight: 600, color: S.ink, lineHeight: 1.2, textDecoration: fait ? "line-through" : "none", textDecorationColor: S.soft }}>{l.titre || "Sans titre"}</div>
                        <button onClick={(e) => { e.stopPropagation(); saveLevier(offre, ph.id, { ...l, statut: TUN_STATUT_NEXT[st.id] }); }} title="Changer le statut"
                          style={{ flex: "none", border: "none", cursor: "pointer", fontSize: 9.5, fontWeight: 700, color: st.col, background: st.bg, padding: "3px 8px", borderRadius: 10, whiteSpace: "nowrap" }}>{st.txt}</button>
                      </div>
                      {l.canal && <span style={{ display: "inline-block", fontSize: 9.5, fontWeight: 700, color: S.deep, background: S.cream, padding: "1px 7px", borderRadius: 10, marginTop: 4 }}>{l.canal}</span>}
                      {l.note && <div style={{ fontSize: 11.5, color: S.soft, marginTop: 4, lineHeight: 1.4 }}>{l.note}</div>}
                    </div>
                  );
                })}
                <button onClick={() => setFLevier({ offre, phase: ph.id, levier: { id: Date.now(), titre: "", canal: "", note: "", statut: "idee" } })} style={{ width: "100%", border: `1.5px dashed ${S.line}`, background: "transparent", color: S.deep, fontWeight: 600, fontSize: 12, padding: "8px", borderRadius: 9, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}><Plus size={13} /> Action</button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
function FicheLevier({ ctx, onClose, onSave, onDelete }) {
  const [f, setF] = useState({ ...ctx.levier });
  const set = (k, v) => setF({ ...f, [k]: v });
  const phaseNom = (TUN_PHASES.find((p) => p.id === ctx.phase) || {}).nom;
  const existant = !!(ctx.levier.titre || ctx.levier.canal || ctx.levier.note);
  return (
    <Modal onClose={onClose} bas>
      <TitreModale titre={`${phaseNom} — action`} onClose={onClose} />
      <Ch label="Titre de l'action"><input value={f.titre} onChange={(e) => set("titre", e.target.value)} placeholder="Ex. Vidéos de promotion" style={inp} /></Ch>
      <Ch label="Statut">
        <div style={{ display: "flex", gap: 6 }}>
          {TUN_STATUTS.map((s) => (
            <button key={s.id} onClick={() => set("statut", s.id)}
              style={{ flex: 1, padding: "9px 6px", borderRadius: 9, fontSize: 12, fontWeight: 700, cursor: "pointer", border: `1.5px solid ${(f.statut || "idee") === s.id ? s.col : S.line}`, background: (f.statut || "idee") === s.id ? s.bg : "#fff", color: s.col }}>{s.txt}</button>
          ))}
        </div>
      </Ch>
      <Ch label="Canal">
        <select value={f.canal || ""} onChange={(e) => set("canal", e.target.value)} style={inp}>
          <option value="">— choisir —</option>
          {CANAUX.map((c) => <option key={c} value={c}>{c}</option>)}
          {f.canal && !CANAUX.includes(f.canal) && <option value={f.canal}>{f.canal}</option>}
        </select>
      </Ch>
      <Ch label="Détail / note"><textarea value={f.note} onChange={(e) => set("note", e.target.value)} rows={3} placeholder="Message, cible, format, cadence…" style={{ ...inp, resize: "vertical", minHeight: 60 }} /></Ch>
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        {existant && <button onClick={() => onDelete(f.id)} title="Supprimer l'action" style={{ ...btnIcon, padding: "13px 15px", color: S.rust }}><Trash2 size={15} /></button>}
        <button onClick={() => f.titre.trim() && onSave(f)} disabled={!f.titre.trim()} style={{ ...btnMain, background: !f.titre.trim() ? S.line : S.panel, color: !f.titre.trim() ? S.soft : S.cream }}><Check size={16} /> Enregistrer</button>
      </div>
    </Modal>
  );
}

/* ================= VUE OBJECTIFS (simulateur d'offres) ================= */
function Objectifs({ prestas, heures, charges, objSim, majPresta, ajouterPresta, supprimerPresta, setHeuresObj, setChargesObj, setConfirmReset, objSaveEtat, caSigne }) {
  const { caRec, caOne, total, missionsRec, simultanes, net } = objSim;
  const pct = (t) => Math.min(100, (total / t) * 100);
  const etatTxt = { "en cours": "enregistrement…", ok: "enregistré dans Notion", err: "échec enregistrement" };
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
        <div>
          <div style={{ fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: S.deep, fontWeight: 600 }}>Simulateur · missions de 6 mois</div>
          <h2 style={{ ...serif, fontSize: 22, fontWeight: 600, color: S.ink, margin: "3px 0 0" }}>Ton objectif annuel</h2>
        </div>
        {objSaveEtat && <span style={{ fontSize: 11.5, color: objSaveEtat === "err" ? S.rust : S.soft }}>{etatTxt[objSaveEtat]}</span>}
      </div>
      <p style={{ fontSize: 12.5, color: S.soft, marginTop: 4 }}>Compose ton mix d'offres visé. Le total devient ton objectif de CA, repris sur l'onglet Pilotage. Sauvegarde auto dans Notion.</p>

      {/* total + jauges */}
      <div style={{ background: S.panel, borderRadius: 16, padding: "20px 18px", marginTop: 14, color: S.cream }}>
        <div style={{ fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: S.gold, fontWeight: 600 }}>CA annuel visé</div>
        <div style={{ ...serif, fontSize: 42, fontWeight: 600, lineHeight: 1, marginTop: 4 }}>
          {Math.round(total).toLocaleString("fr-FR")}<span style={{ fontSize: 15, color: S.gold, marginLeft: 5 }}>€ HT</span>
        </div>
        <div style={{ fontSize: 12.5, color: "#C9BFAE", marginTop: 6 }}>{eur(caRec)} de récurrent · {eur(caOne)} de ponctuel · déjà signé {eur(caSigne)}</div>
        {[60000, 80000].map((t) => (
          <div key={t} style={{ marginTop: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#C9BFAE", marginBottom: 5 }}>
              <span>Palier {t / 1000}k</span>
              <span style={{ color: total >= t ? "#9DBF9D" : "#E0A277", fontWeight: 600 }}>{total >= t ? `atteint, +${eur(total - t)}` : `manque ${eur(t - total)}`}</span>
            </div>
            <div style={{ height: 10, background: "#3a352e", borderRadius: 6, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${pct(t)}%`, background: `linear-gradient(90deg,${S.deep},${S.gold})`, borderRadius: 6, transition: "width .35s" }} />
            </div>
          </div>
        ))}
      </div>

      {/* indicateurs */}
      <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>
        {[
          { l: "Clients simultanés", v: simultanes.toFixed(1), s: `${missionsRec} missions / an` },
          { l: "Charge mensuelle", v: `${Math.round(simultanes * heures)} h`, s: `à ${heures} h par client` },
          { l: "Reste après charges", v: net === null ? "—" : eur(net), s: "sur l'année" },

          <div key={i} style={{ flex: "1 1 150px", background: S.paper, border: `1px solid ${S.line}`, borderRadius: 12, padding: "11px 13px" }}>
            <div style={{ fontSize: 10, letterSpacing: "0.05em", textTransform: "uppercase", color: S.deep, fontWeight: 600 }}>{k.l}</div>
            <div style={{ ...serif, fontSize: 22, color: S.ink, marginTop: 2 }}>{k.v}</div>
            <div style={{ fontSize: 11.5, color: S.soft }}>{k.s}</div>
          </div>
        ))}
      </div>

      <div style={{ display: "flex", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
        {[{ l: "h / client / mois", v: heures, set: setHeuresObj }, { l: "charges € / mois", v: charges, set: setChargesObj }].map((f, i) => (

            {f.l}
            <input type="number" value={f.v} min="0" onChange={(e) => f.set(Math.max(0, Number(e.target.value) || 0))}

              <Trash2 size={13} />
            </button>
          </div>
          <div style={{ marginTop: 9 }}>
