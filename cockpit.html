<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  html,body{margin:0;padding:0}
  #root{min-height:100vh;background:#F4EFE6}

<body>
<div id="root"><div id="boot">Chargement…</div></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ================= CONNEXION WORKER ================= */
const WORKER_URL = "https://pilotage-notion-worker.loumiwassim.workers.dev";
const PILOT_KEY  = "pilot-6f3a9c2e8b1d47-write"; /* clé d'écriture PUBLIQUE (gate anti-abus) */

async function apiGet() {
  const r = await fetch(WORKER_URL, { method: "GET" });
  if (!r.ok) throw new Error("worker-" + r.status);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d.results || [];
}
async function apiWrite(method, body) {
  const r = await fetch(WORKER_URL, {
    method,
    headers: { "Content-Type": "application/json", "X-Pilot-Key": PILOT_KEY },
    body: JSON.stringify(body),
  });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok || d.error) throw new Error(d.error || ("http-" + r.status));
  return d;
}
const apiCreate  = (fields) => apiWrite("POST",   { fields });
const apiUpdate  = (id, fields) => apiWrite("PATCH", { id, fields });
const apiArchive = (id) => apiWrite("DELETE", { id });

/* ================= MAPPING NOTION <-> APP ================= */
const TYPE_NAME  = { prog: "Programme récurrent", site: "Site web", forma: "Formation Claude", ponc: "Autre ponctuel" };
const TYPE_ID    = Object.fromEntries(Object.entries(TYPE_NAME).map(([k, v]) => [v, k]));
const ETAPE_NAME = { prospect: "Prospect", contacte: "Contacté", diagnostic: "Diagnostic", propale: "Propale", signe: "Signé", perdu: "Perdu" };
const ETAPE_ID   = Object.fromEntries(Object.entries(ETAPE_NAME).map(([k, v]) => [v, k]));
const rtext = (prop) => (prop && prop.rich_text ? prop.rich_text.map((t) => t.plain_text).join("") : "");
const isNotionId = (id) => typeof id === "string";

/* ================= exercice : 1 sept 2026 → 31 août 2027 ================= */
const FY = [];
for (let i = 0; i < 12; i++) {
  const y = 2026 + Math.floor((8 + i) / 12);
  const m = ((8 + i) % 12) + 1;
  FY.push({ y, m, key: `${y}-${String(m).padStart(2, "0")}` });
}
const CHOIX = [];
for (let i = -12; i < 24; i++) {
  const y = 2026 + Math.floor((8 + i) / 12);
  const m = ((((8 + i) % 12) + 12) % 12) + 1;
  CHOIX.push({ y, m, key: `${y}-${String(m).padStart(2, "0")}`, idx: i });
}
const MOIS = ["janv", "févr", "mars", "avr", "mai", "juin", "juil", "août", "sept", "oct", "nov", "déc"];
const lab = (y, m) => `${MOIS[m - 1]} ${y}`;
const labKey = (k) => { const [y, m] = k.split("-").map(Number); return lab(y, m); };
const idxOf = (ym) => { const [y, m] = ym.split("-").map(Number); return (y - 2026) * 12 + (m - 9); };
const eur = (n) => Math.round(n).toLocaleString("fr-FR") + " €";
const court = (n) => (n ? Math.round(n).toLocaleString("fr-FR") : "");
const TVA = 0.20;

const TYPES = [
  { id: "prog", nom: "Programme récurrent", rec: true },
  { id: "site", nom: "Site web", rec: false },
  { id: "forma", nom: "Formation Claude", rec: false },
  { id: "ponc", nom: "Autre ponctuel", rec: false },
];
const est = (id) => TYPES.find((t) => t.id === id) || TYPES[0];

const ETAPES = [
  { id: "prospect", nom: "Prospect", proba: 0.05, col: "#8C8478" },
  { id: "contacte", nom: "Contacté", proba: 0.15, col: "#6B6A86" },
  { id: "diagnostic", nom: "Diagnostic", proba: 0.4, col: "#5B7A8C" },
  { id: "propale", nom: "Propale", proba: 0.6, col: "#B08D57" },
  { id: "signe", nom: "Signé", proba: 1, col: "#5B7A5B" },
  { id: "perdu", nom: "Perdu", proba: 0, col: "#A9683F" },
];
const etp = (id) => ETAPES.find((e) => e.id === id) || ETAPES[0];
const SOURCES = ["BNI", "LinkedIn", "Recommandation", "Réseau", "Site web", "Autre"];

/* chaque contrat signé génère un tableau d'échéances {mkey, du, encaisse} */
function echeances(c) {
  const i0 = idxOf(c.debut);
  const n = est(c.type).rec ? Number(c.duree) || 6 : 1;
  const out = [];
  for (let k = 0; k < n; k++) {
    const i = i0 + k;
    if (i < 0 || i > 11) continue;
    out.push({ mkey: FY[i].key, du: Number(c.prix), encaisse: null });
  }
  return out;
}

/* résultats Notion -> {clients, prospects} */
function mapRows(rows) {
  const clients = [], prospects = [];
  rows.forEach((r) => {
    const p = r.properties || {};
    const title = (p["Client"] && p["Client"].title ? p["Client"].title.map((t) => t.plain_text).join("") : "").trim();
    const statut = p["Statut"] && p["Statut"].select ? p["Statut"].select.name : "Signé";
    const montant = p["Montant HT"] && p["Montant HT"].number != null ? p["Montant HT"].number : 0;
    if (statut === "Pipeline") {
      const etName = p["Étape"] && p["Étape"].select ? p["Étape"].select.name : "Prospect";
      prospects.push({
        id: r.id,
        societe: title,
        nom: rtext(p["Contact"]),
        etape: ETAPE_ID[etName] || "prospect",
        type: TYPE_ID[p["Type"] && p["Type"].select ? p["Type"].select.name : ""] || "",
        montant: montant || "",
        offre: rtext(p["Offre"]),
        source: p["Source"] && p["Source"].select ? p["Source"].select.name : "",
        relance: (p["Relance"] && p["Relance"].date ? p["Relance"].date.start : "") || "",
        note: rtext(p["Notes"]),
        maj: 0,
      });
    } else {
      const tName = p["Type"] && p["Type"].select ? p["Type"].select.name : "Autre ponctuel";
      const typeId = TYPE_ID[tName] || "ponc";
      const debutFull = p["Début"] && p["Début"].date ? p["Début"].date.start : null;
      const debut = debutFull ? debutFull.slice(0, 7) : FY[0].key;
      const duree = p["Durée mois"] && p["Durée mois"].number != null ? p["Durée mois"].number : (est(typeId).rec ? 6 : 1);
      let encMap = {};
      try { encMap = JSON.parse(rtext(p["Encaissements"]) || "{}") || {}; } catch (e) { encMap = {}; }
      const c = { id: r.id, nom: title, type: typeId, prix: montant, debut, duree };
      c.ech = echeances(c).map((e) => ({ ...e, encaisse: encMap[e.mkey] != null ? Number(encMap[e.mkey]) : null }));
      clients.push(c);
    }
  });
  return { clients, prospects };
}

const S = { cream: "#F4EFE6", paper: "#FBF8F2", ink: "#26231F", soft: "#514B42", gold: "#B08D57", deep: "#8C6D3F", line: "#E3D9C7", panel: "#282420", green: "#5B7A5B", rust: "#A9683F", grid: "#EAE1D0" };
const serif = { fontFamily: "'EB Garamond', Georgia, serif" };
const sans = { fontFamily: "'Raleway', system-ui, sans-serif" };

/* ================= ICÔNES (lucide inline) ================= */
const ic = (props) => ({ size = 16, ...p }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>{props}</svg>
);
const Plus = ic(<><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></>);
const Trash2 = ic(<><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></>);
const Check = ic(<polyline points="20 6 9 17 4 12" />);
const X = ic(<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>);
const Users = ic(<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></>);
const Wallet = ic(<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" /><path d="M3 5v14a2 2 0 0 0 2 2h16v-5" /><path d="M18 12a2 2 0 0 0 0 4h4v-4Z" /></>);
const FileText = ic(<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><line x1="10" y1="9" x2="8" y2="9" /></>);
const TrendingUp = ic(<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></>);
const AlertTriangle = ic(<><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></>);
const ArrowRight = ic(<><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></>);
const RefreshCw = ic(<><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></>);

/* ================= APP ================= */
function Cockpit() {
  const [vue, setVue] = useState("pilotage");
  const [clients, setClients] = useState([]);
  const [prospects, setProspects] = useState([]);
  const [heures] = useState(5);
  const [chargement, setChargement] = useState(true);
  const [erreur, setErreur] = useState("");
  const [live, setLive] = useState(false);
  const [occupe, setOccupe] = useState(false);

  const [fProspect, setFProspect] = useState(null);
  const [fClient, setFClient] = useState(null);
  const [signature, setSignature] = useState(null);
  const [aSupprimer, setASupprimer] = useState(null);

  async function reload() {
    setErreur("");
    try {
      const rows = await apiGet();
      const { clients, prospects } = mapRows(rows);
      setClients(clients);
      setProspects(prospects);
      setLive(true);
    } catch (e) {
      setLive(false);
      setErreur("Lecture Notion impossible (" + e.message + ").");
    } finally {
      setChargement(false);
    }
  }
  useEffect(() => { reload(); }, []);

  /* enveloppe une écriture : indicateur d'occupation + rechargement + message d'erreur */
  async function ecrire(fn, label) {
    setOccupe(true);
    try { await fn(); await reload(); }
    catch (e) { setErreur((label || "Enregistrement") + " impossible (" + e.message + ")."); }
    finally { setOccupe(false); }
  }

  /* ---------------- calculs partagés ---------------- */
  const moisSigne = FY.map((o) =>
    clients.reduce((s, c) => s + (c.ech || []).filter((e) => e.mkey === o.key).reduce((x, e) => x + e.du, 0), 0)
  );
  const moisEncaisse = FY.map((o) =>
    clients.reduce((s, c) => s + (c.ech || []).filter((e) => e.mkey === o.key && e.encaisse != null).reduce((x, e) => x + Number(e.encaisse), 0), 0)
  );
  const caSigne = moisSigne.reduce((a, b) => a + b, 0);
  const caEncaisse = moisEncaisse.reduce((a, b) => a + b, 0);
  let acc = 0; const cumulSigne = moisSigne.map((m) => (acc += m));

  const pipePondere = prospects
    .filter((p) => !["signe", "perdu"].includes(p.etape))
    .reduce((s, p) => s + (Number(p.montant) || 0) * etp(p.etape).proba, 0);
  const pipeBrut = prospects
    .filter((p) => !["signe", "perdu"].includes(p.etape))
    .reduce((s, p) => s + (Number(p.montant) || 0), 0);

  const now = new Date();
  const idxNow = (now.getFullYear() - 2026) * 12 + (now.getMonth() + 1 - 9);
  const impayes = [];
  clients.forEach((c) =>
    (c.ech || []).forEach((e) => {
      const i = idxOf(e.mkey);
      if (i < idxNow && e.encaisse == null) impayes.push({ client: c.nom, mkey: e.mkey, du: e.du });
    })
  );
  const totalImpayes = impayes.reduce((s, e) => s + e.du, 0);

  const simultanes = (() => {
    const parMois = FY.map((o) => clients.filter((c) => est(c.type).rec && (c.ech || []).some((e) => e.mkey === o.key)).length);
    const actifs = parMois.filter((n) => n > 0);
    return actifs.length ? actifs.reduce((a, b) => a + b, 0) / actifs.length : 0;
  })();

  const tvaAReverser = caEncaisse * TVA;

  /* ---------------- actions (écrivent dans Notion) ---------------- */
  const champsProspect = (p) => ({
    "Client": p.societe || p.nom || "",
    "Statut": "Pipeline",
    "Étape": ETAPE_NAME[p.etape] || "Prospect",
    "Type": p.type ? TYPE_NAME[p.type] : null,
    "Contact": p.nom || "",
    "Montant HT": p.montant === "" || p.montant == null ? null : Number(p.montant),
    "Offre": p.offre || "",
    "Source": p.source || null,
    "Relance": p.relance || null,
    "Notes": p.note || "",
  });
  const majProspect = (p) => ecrire(
    () => (isNotionId(p.id) ? apiUpdate(p.id, champsProspect(p)) : apiCreate(champsProspect(p))),
    "Enregistrement du prospect"
  );
  const bougerEtape = (p, dir) => {
    const ordre = ["prospect", "contacte", "diagnostic", "propale", "signe"];
    const i = ordre.indexOf(p.etape);
    if (dir > 0 && p.etape === "propale") { setSignature({ ...p }); return; }
    const ni = Math.max(0, Math.min(ordre.length - 1, i + dir));
    ecrire(() => apiUpdate(p.id, { "Étape": ETAPE_NAME[ordre[ni]] }), "Déplacement de l'étape");
  };
  const marquerPerdu = (p) => ecrire(() => apiUpdate(p.id, { "Étape": "Perdu" }), "Mise à jour");

  const champsContrat = (d) => ({
    "Client": d.nom,
    "Type": TYPE_NAME[d.type],
    "Montant HT": Number(d.prix),
    "Début": d.debut + "-01",
    "Durée mois": Number(d.duree) || 1,
    "Statut": "Signé",
  });
  const confirmerSignature = (data) => {
    const base = { ...champsContrat(data), "Étape": "Signé" };
    ecrire(
      () => (signature && isNotionId(signature.id) ? apiUpdate(signature.id, base) : apiCreate(base)),
      "Signature"
    );
    setSignature(null);
  };
  const majClient = (c) => ecrire(
    () => (isNotionId(c.id) ? apiUpdate(c.id, champsContrat(c)) : apiCreate(champsContrat(c))),
    "Enregistrement du contrat"
  );

  const encaisser = (clientId, mkey, valeur) => {
    const c = clients.find((x) => x.id === clientId);
    if (!c) return;
    const val = valeur === "" || valeur == null ? null : Number(valeur);
    const nech = c.ech.map((e) => (e.mkey === mkey ? { ...e, encaisse: val } : e));
    const encMap = {};
    nech.forEach((e) => { if (e.encaisse != null) encMap[e.mkey] = e.encaisse; });
    const total = Object.values(encMap).reduce((a, b) => a + b, 0);
    setClients(clients.map((x) => (x.id === clientId ? { ...x, ech: nech } : x))); /* optimiste */
    ecrire(() => apiUpdate(clientId, { "Encaissements": JSON.stringify(encMap), "Encaissé HT": total }), "Encaissement");
  };

  if (chargement)
    return <div style={{ ...sans, background: S.cream, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: S.soft }}>Lecture de Notion…</div>;

  const NAV = [
    { id: "pilotage", nom: "Pilotage", ic: <TrendingUp size={16} /> },
    { id: "crm", nom: "CRM", ic: <Users size={16} /> },
    { id: "treso", nom: "Trésorerie", ic: <Wallet size={16} /> },
    { id: "contrats", nom: "Contrats", ic: <FileText size={16} /> },
  ];

  return (
    <div style={{ ...sans, background: S.cream, minHeight: "100vh", paddingBottom: 104 }}>
      <style>{`input,select,button,textarea{font-family:'Raleway',system-ui,sans-serif}
        input[type=number]{-moz-appearance:textfield}
        input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
        .wrap::-webkit-scrollbar{height:9px}.wrap::-webkit-scrollbar-thumb{background:${S.line};border-radius:9px}
        .cel:hover{background:#FFF9EE!important;cursor:cell}
        .pagenav{position:sticky;top:0;z-index:40;background:${S.panel};display:flex;gap:8px;padding:11px 14px;overflow-x:auto;border-bottom:1px solid ${S.deep}}
        .pagenav a{flex:none;color:#C9BFAE;text-decoration:none;font-size:13px;font-weight:600;padding:9px 15px;border-radius:10px;white-space:nowrap}
        .pagenav a.on{color:${S.cream};background:${S.deep}}`}</style>

      <div className="pagenav">
        <a href="cockpit.html" className="on">Cockpit CA</a>
        <a href="pilotage-live.html">Pilotage</a>
      </div>

      {/* barre titre */}
      <div style={{ padding: "18px 16px 0", maxWidth: 1120, margin: "0 auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
          <div>
            <div style={{ fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: S.deep, fontWeight: 600 }}>
              Poste de pilotage · exercice sept. 2026 → août 2027
            </div>
            <h1 style={{ ...serif, fontSize: 27, fontWeight: 600, margin: "4px 0 2px", color: S.ink }}>Copilote digital</h1>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: S.soft, marginTop: 2 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: live ? S.green : S.gold, display: "inline-block" }} />
              {live ? "Notion en direct · édition synchronisée" : "Notion injoignable"}
            </div>
          </div>
          <button onClick={reload} disabled={occupe}
            style={{ flex: "none", marginTop: 4, border: `1px solid ${S.line}`, background: S.paper, color: S.deep, fontWeight: 600, fontSize: 12, borderRadius: 10, padding: "8px 12px", cursor: occupe ? "default" : "pointer", opacity: occupe ? 0.6 : 1, display: "flex", alignItems: "center", gap: 5 }}>
            <RefreshCw size={13} /> {occupe ? "…" : "Rafraîchir"}
          </button>
        </div>
        {erreur && <div style={{ background: "#F6EDE4", border: `1px solid ${S.rust}`, borderRadius: 10, padding: "8px 12px", fontSize: 12.5, color: S.rust, marginTop: 8 }}>{erreur}</div>}
      </div>

      <div style={{ padding: "20px 18px 0", maxWidth: 1120, margin: "0 auto" }}>
        {vue === "pilotage" && <Pilotage {...{ caSigne, caEncaisse, moisSigne, cumulSigne, pipePondere, pipeBrut, prospects, simultanes, heures, totalImpayes, impayes, setVue }} />}
        {vue === "crm" && <CRM {...{ prospects, setFProspect, bougerEtape, marquerPerdu, pipePondere, pipeBrut }} />}
        {vue === "treso" && <Treso {...{ clients, moisSigne, moisEncaisse, encaisser, tvaAReverser, caEncaisse, impayes, totalImpayes }} />}
        {vue === "contrats" && <Contrats {...{ clients, setFClient, setASupprimer, caSigne }} />}
      </div>

      {/* barre navigation basse */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: S.panel, borderTop: `1px solid ${S.deep}`, display: "flex", justifyContent: "center", gap: 10, padding: "10px 12px calc(12px + env(safe-area-inset-bottom))", zIndex: 30 }}>
        {NAV.map((n) => (
          <button key={n.id} onClick={() => setVue(n.id)}
            style={{ flex: "1 1 0", maxWidth: 160, background: vue === n.id ? S.deep : "transparent", border: "none", borderRadius: 12, color: vue === n.id ? S.cream : "#C9BFAE", padding: "9px 6px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 5, fontSize: 11.5, fontWeight: 600 }}>
            {n.ic}{n.nom}
          </button>
        ))}
      </div>

      {/* modales */}
      {fProspect !== null && <FicheProspect p={fProspect} onClose={() => setFProspect(null)} onSave={(p) => { majProspect(p); setFProspect(null); }} onDelete={(id) => { if (isNotionId(id)) ecrire(() => apiArchive(id), "Suppression"); setFProspect(null); }} />}
      {signature && <FicheSignature p={signature} onClose={() => setSignature(null)} onConfirm={confirmerSignature} />}
      {fClient && <FicheClient c={fClient} onClose={() => setFClient(null)} onSave={(c) => { majClient(c); setFClient(null); }} />}
      {aSupprimer && (
        <Modal onClose={() => setASupprimer(null)}>
          <div style={{ ...serif, fontSize: 19, fontWeight: 600, color: S.ink }}>Supprimer {aSupprimer.nom} ?</div>
          <p style={{ fontSize: 13, color: S.soft, marginTop: 6 }}>Le contrat sera archivé dans Notion (récupérable depuis la corbeille Notion).</p>
          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            <button onClick={() => setASupprimer(null)} style={btnSec}>Annuler</button>
            <button onClick={() => { if (isNotionId(aSupprimer.id)) ecrire(() => apiArchive(aSupprimer.id), "Suppression"); setASupprimer(null); }} style={{ ...btnSec, background: S.rust, color: "#fff", border: "none" }}>Archiver</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= VUE PILOTAGE ================= */

        </div>
        <div style={{ fontSize: 12.5, color: "#C9BFAE", marginTop: 6 }}>

        {[60000, 80000].map((t) => (

            <div style={{ height: 10, background: "#3a352e", borderRadius: 6, overflow: "hidden", position: "relative" }}>
              <div style={{ height: "100%", width: `${Math.min(100, (caSigne / t) * 100)}%`, background: `linear-gradient(90deg,${S.deep},${S.gold})`, borderRadius: 6 }} />
              {projete > caSigne && <div style={{ position: "absolute", top: 0, height: "100%", left: `${Math.min(100, (caSigne / t) * 100)}%`, width: `${Math.min(100 - (caSigne / t) * 100, ((projete - caSigne) / t) * 100)}%`, background: "repeating-linear-gradient(45deg,#5d564c,#5d564c 4px,transparent 4px,transparent 8px)" }} />}

          </div>

      <div style={{ background: S.paper, border: `1px solid ${S.line}`, borderLeft: `4px solid ${S.gold}`, borderRadius: 14, padding: "15px 17px", marginTop: 12 }}>
        <div style={{ ...serif, fontSize: 18, fontWeight: 600, color: S.ink, marginBottom: 6 }}>Ce qu'il te reste à faire</div>
        <p style={{ fontSize: 13.5, color: S.soft, lineHeight: 1.6, margin: 0 }}>
          Il te manque <b style={{ color: S.ink }}>{court(manque60)} €</b> pour 60k. À un panier moyen de 525 € sur 6 mois, soit 3 150 € par mandat, cela représente <b style={{ color: S.ink }}>{Math.ceil(manque60 / 3150)} mandats</b> à signer.
          Avec un taux de signature de 1 propale sur 3, tu dois envoyer <b style={{ color: S.ink }}>{Math.ceil((manque60 / 3150) * 3)} propales</b>. Tu as aujourd'hui <b style={{ color: S.ink }}>{actifs}</b> prospects actifs dans ton pipeline.

      <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>

          { l: "Pipeline pondéré", v: `${court(pipePondere)} €`, s: `${court(pipeBrut)} € au total`, go: "crm" },

            <div style={{ ...serif, fontSize: 21, color: k.alerte ? S.rust : S.ink, marginTop: 2 }}>{k.v}</div>

          <AlertTriangle size={12} /> La falaise après décembre, c'est ton vrai chantier : renouvellement et acquisition.
        </div>
      </div>
    </div>
  );
}

/* ================= VUE TRÉSORERIE ================= */
function Treso({ clients, moisSigne, moisEncaisse, encaisser, tvaAReverser, caEncaisse, impayes, totalImpayes }) {
  const [edit, setEdit] = useState(null);
  const [tampon, setTampon] = useState("");
  const W = 76, WN = 150;
  const th = { position: "sticky", top: 0, background: S.panel, color: S.cream, fontSize: 10, fontWeight: 700, textTransform: "uppercase", padding: "8px 7px", textAlign: "right", whiteSpace: "nowrap" };
  const td = { padding: 0, borderBottom: `1px solid ${S.grid}`, borderRight: `1px solid ${S.grid}`, textAlign: "right", fontSize: 12.5, height: 36 };

  const lignesRec = clients.filter((c) => (c.ech || []).length);

  return (
    <div>
      <p style={{ fontSize: 12.5, color: S.soft, marginTop: 4, marginBottom: 6 }}>
        Ligne <b>dû</b> calculée depuis les contrats. Touchez une cellule <b>encaissé</b> pour saisir ce que vous avez réellement reçu — c'est écrit dans Notion. Une échéance passée non encaissée bascule en impayé. La ligne <b>TVA estim. 20 %</b> prévoit ce que tu devras régler chaque mois, estimée à 20 % du CA dû du mois.
      </p>

      <div className="wrap" style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
        <table style={{ borderCollapse: "separate", borderSpacing: 0, background: S.paper, border: `1px solid ${S.line}`, borderRadius: 12, overflow: "hidden", minWidth: WN + W * 12 + 70 }}>
          <thead>
            <tr>
              <th style={{ ...th, position: "sticky", left: 0, zIndex: 4, textAlign: "left", width: WN, minWidth: WN }}>Contrat</th>
              {FY.map((o) => <th key={o.key} style={{ ...th, width: W, minWidth: W }}>{MOIS[o.m - 1]}<br /><span style={{ color: S.gold }}>{String(o.y).slice(2)}</span></th>)}
            </tr>
          </thead>
          <tbody>
            {lignesRec.map((c) => (
              <tr key={c.id}>
                <td style={{ position: "sticky", left: 0, zIndex: 2, background: S.paper, borderRight: `2px solid ${S.line}`, borderBottom: `1px solid ${S.grid}`, padding: "5px 9px", width: WN, minWidth: WN }}>
                  <div style={{ ...serif, fontSize: 13.5, fontWeight: 600, color: S.ink, lineHeight: 1.15 }}>{c.nom}</div>
                </td>
                {FY.map((o, i) => {
                  const e = (c.ech || []).find((x) => x.mkey === o.key);
                  const enEdit = edit && edit.id === c.id && edit.mkey === o.key;
                  const retard = e && e.encaisse == null && idxOf(o.key) < ((new Date().getFullYear() - 2026) * 12 + (new Date().getMonth() + 1 - 9));
                  return (
                    <td key={o.key} className={e ? "cel" : ""} style={{ ...td, width: W, minWidth: W, background: !e ? "transparent" : retard ? "#F6E7DE" : e.encaisse != null ? "#EDF1EC" : "#FFFDF9" }}
                      onClick={() => { if (e && !enEdit) { setEdit({ id: c.id, mkey: o.key }); setTampon(e.encaisse != null ? String(e.encaisse) : String(e.du)); } }}>
                      {!e ? <div style={{ lineHeight: "35px", color: S.line, textAlign: "center" }}>·</div> :
                        enEdit ? (
                          <input autoFocus type="number" value={tampon} onChange={(ev) => setTampon(ev.target.value)}
                            onBlur={() => { encaisser(c.id, o.key, tampon); setEdit(null); }}
                            onKeyDown={(ev) => { if (ev.key === "Enter") { encaisser(c.id, o.key, tampon); setEdit(null); } if (ev.key === "Escape") setEdit(null); }}
                            style={{ width: "100%", height: 34, border: `2px solid ${S.gold}`, borderRadius: 4, textAlign: "right", padding: "0 5px", fontSize: 12.5, fontWeight: 600, background: "#fff", outline: "none" }} />
                        ) : (
                          <div style={{ padding: "0 7px", lineHeight: "35px" }}>
                            <span style={{ fontSize: 12.5, fontWeight: 600, color: e.encaisse != null ? S.green : retard ? S.rust : S.soft }}>
                              {e.encaisse != null ? court(e.encaisse) : court(e.du)}
                            </span>
                          </div>
                        )}
                    </td>
                  );
                })}
              </tr>
            ))}
            <tr>
              <td style={{ position: "sticky", left: 0, background: S.panel, borderRight: `1px solid #3a352e`, padding: "6px 9px" }}>
                <span style={{ ...serif, fontSize: 13.5, fontWeight: 600, color: S.cream }}>Dû</span>
              </td>
              {moisSigne.map((v, i) => <td key={i} style={{ ...td, background: S.panel, borderRight: `1px solid #3a352e` }}><div style={{ ...serif, padding: "0 7px", lineHeight: "35px", fontSize: 13, color: v ? S.cream : "#5d564c" }}>{v ? court(v) : "·"}</div></td>)}
            </tr>
            <tr>
              <td style={{ position: "sticky", left: 0, background: "#EDF1EC", borderRight: `2px solid ${S.line}`, padding: "6px 9px" }}>
                <span style={{ fontSize: 11.5, fontWeight: 700, textTransform: "uppercase", color: S.green }}>Encaissé</span>
              </td>
              {moisEncaisse.map((v, i) => <td key={i} style={{ ...td, background: "#EDF1EC" }}><div style={{ padding: "0 7px", lineHeight: "35px", fontSize: 12.5, fontWeight: 600, color: v ? S.green : S.line }}>{v ? court(v) : "·"}</div></td>)}
            </tr>
            <tr>
              <td style={{ position: "sticky", left: 0, background: "#F6EDE4", borderRight: `2px solid ${S.line}`, padding: "6px 9px" }}>
                <span style={{ fontSize: 11.5, fontWeight: 700, textTransform: "uppercase", color: S.deep }}>TVA estim. 20 %</span>
              </td>
              {moisSigne.map((v, i) => { const t = v * TVA; return <td key={i} style={{ ...td, background: "#F6EDE4" }}><div style={{ padding: "0 7px", lineHeight: "35px", fontSize: 12.5, fontWeight: 600, color: t ? S.deep : S.line }}>{t ? court(t) : "·"}</div></td>; })}
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

    <Modal onClose={onClose} bas>
      <TitreModale titre="Signature — détails de la prestation" onClose={onClose} />
      <div style={{ background: "#EDF1EC", border: `1px solid ${S.line}`, borderRadius: 10, padding: "9px 12px", fontSize: 12.5, color: S.green, marginBottom: 12 }}>
        Bravo. Renseigne le contrat, les échéances de trésorerie se créent automatiquement.
      </div>
      <Ch label="Nom du contrat"><input value={f.nom} onChange={(e) => set("nom", e.target.value)} style={inp} /></Ch>
      <Ch label="Type">
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {TYPES.map((t) => (
            <button key={t.id} onClick={() => set("type", t.id)} style={{ flex: "1 1 46%", padding: "9px 8px", borderRadius: 9, fontSize: 12.5, fontWeight: 600, cursor: "pointer", border: `1px solid ${f.type === t.id ? S.deep : S.line}`, background: f.type === t.id ? S.deep : "#fff", color: f.type === t.id ? S.cream : S.soft }}>{t.nom}</button>
          ))}
        </div>
      </Ch>
      <div style={{ display: "flex", gap: 10 }}>
        <Ch label={est(f.type).rec ? "€ / mois" : "€ total"} flex><input type="number" value={f.prix} onChange={(e) => set("prix", e.target.value)} style={inp} /></Ch>
        {est(f.type).rec && <Ch label="Durée (mois)" flex><input type="number" value={f.duree} min="1" max="36" onChange={(e) => set("duree", e.target.value)} style={inp} /></Ch>}
      </div>
      <Ch label={est(f.type).rec ? "Mois de démarrage" : "Mois de facturation"}>
        <select value={f.debut} onChange={(e) => set("debut", e.target.value)} style={inp}>
          {CHOIX.map((o) => <option key={o.key} value={o.key}>{lab(o.y, o.m)}{o.idx < 0 ? " (exercice préc.)" : o.idx > 11 ? " (exercice suiv.)" : ""}</option>)}
        </select>
      </Ch>
      <button onClick={() => (f.nom.trim() && Number(f.prix) > 0) && onConfirm(f)} disabled={!f.nom.trim() || !(Number(f.prix) > 0)}
        style={{ ...btnMain, marginTop: 8, background: !f.nom.trim() || !(Number(f.prix) > 0) ? S.line : S.panel, color: !f.nom.trim() || !(Number(f.prix) > 0) ? S.soft : S.cream }}>
        <Check size={16} /> Créer le contrat
      </button>
    </Modal>
  );
}

function FicheClient({ c, onClose, onSave }) {
  const [f, setF] = useState({ ...c });
  const set = (k, v) => setF({ ...f, [k]: v });
  return (
    <Modal onClose={onClose} bas>
      <TitreModale titre={c.nom ? "Modifier le contrat" : "Nouveau contrat"} onClose={onClose} />
      <Ch label="Nom du contrat"><input value={f.nom} onChange={(e) => set("nom", e.target.value)} placeholder="Ex. Optel Services" style={inp} /></Ch>
      <Ch label="Type">
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {TYPES.map((t) => (
            <button key={t.id} onClick={() => set("type", t.id)} style={{ flex: "1 1 46%", padding: "9px 8px", borderRadius: 9, fontSize: 12.5, fontWeight: 600, cursor: "pointer", border: `1px solid ${f.type === t.id ? S.deep : S.line}`, background: f.type === t.id ? S.deep : "#fff", color: f.type === t.id ? S.cream : S.soft }}>{t.nom}</button>
          ))}
        </div>
      </Ch>
      <div style={{ display: "flex", gap: 10 }}>
        <Ch label={est(f.type).rec ? "€ / mois" : "€ total"} flex><input type="number" value={f.prix} onChange={(e) => set("prix", e.target.value)} style={inp} /></Ch>
        {est(f.type).rec && <Ch label="Durée (mois)" flex><input type="number" value={f.duree} min="1" max="36" onChange={(e) => set("duree", e.target.value)} style={inp} /></Ch>}
      </div>
      <Ch label={est(f.type).rec ? "Mois de démarrage" : "Mois de facturation"}>
        <select value={f.debut} onChange={(e) => set("debut", e.target.value)} style={inp}>
          {CHOIX.map((o) => <option key={o.key} value={o.key}>{lab(o.y, o.m)}{o.idx < 0 ? " (exercice préc.)" : o.idx > 11 ? " (exercice suiv.)" : ""}</option>)}
        </select>
      </Ch>
      <button onClick={() => (f.nom.trim() && Number(f.prix) > 0) && onSave(f)} disabled={!f.nom.trim() || !(Number(f.prix) > 0)}
        style={{ ...btnMain, marginTop: 8, background: !f.nom.trim() || !(Number(f.prix) > 0) ? S.line : S.panel, color: !f.nom.trim() || !(Number(f.prix) > 0) ? S.soft : S.cream }}>
        <Check size={16} /> Enregistrer
      </button>
      <p style={{ fontSize: 11.5, color: S.soft, marginTop: 10, lineHeight: 1.5 }}>Modifier le prix ou les dates recalcule les échéances de trésorerie. Les encaissements déjà saisis sont conservés.</p>
    </Modal>
  );
}

function TitreModale({ titre, onClose }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
      <span style={{ ...serif, fontSize: 20, fontWeight: 600, color: S.ink }}>{titre}</span>
      <button onClick={onClose} style={btnIcon}><X size={16} /></button>
    </div>
  );
}
function Ch({ label, children, flex }) {
  return (
    <div style={{ marginBottom: 15, flex: flex ? 1 : undefined, minWidth: 0 }}>
      <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: S.deep, fontWeight: 600, marginBottom: 5 }}>{label}</div>
      {children}
    </div>
  );
}
const inp = { width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${S.line}`, background: "#fff", fontSize: 14.5, color: S.ink, fontWeight: 500 };
const btnMain = { width: "100%", padding: 14, borderRadius: 12, border: "none", background: S.panel, color: S.cream, fontWeight: 600, fontSize: 14.5, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 7 };
const btnSec = { flex: 1, padding: 12, borderRadius: 10, border: `1px solid ${S.line}`, background: "#fff", color: S.soft, fontWeight: 600, fontSize: 13.5, cursor: "pointer" };
const btnAdd = { border: `1.5px dashed ${S.gold}`, background: "transparent", color: S.deep, fontWeight: 600, fontSize: 13.5, borderRadius: 11, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 };
const btnIcon = { height: 32, minWidth: 32, border: `1px solid ${S.line}`, background: "#fff", borderRadius: 8, color: S.soft, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" };

ReactDOM.createRoot(document.getElementById("root")).render(<Cockpit />);
</script>
</body>
</html>
