      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginTop: 24, marginBottom: 2 }}>
        <h3 style={{ ...serif, fontSize: 20, fontWeight: 600, color: S.ink }}>Prestations</h3>
        <button onClick={() => setConfirmReset(true)} style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", color: S.deep, fontSize: 11.5, fontWeight: 600, cursor: "pointer", padding: 4 }}>
          <RotateCcw size={12} /> Prix validés
        </button>
      </div>

      {prestas.map((p) => (
        <div key={p.id} style={{ background: S.paper, border: `1px solid ${S.line}`, borderLeft: `4px solid ${p.type === "rec" ? S.deep : S.gold}`, borderRadius: 12, padding: "12px 13px", marginTop: 9 }}>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 9.5, letterSpacing: "0.07em", textTransform: "uppercase", color: S.deep, fontWeight: 700, marginBottom: 3 }}>Intitulé</div>
              <input value={p.nom} onChange={(e) => majPresta(p.id, "nom", e.target.value)} placeholder="Nom de la prestation"
                style={{ ...serif, width: "100%", fontSize: 17, fontWeight: 600, color: S.ink, background: "#fff", border: `1px solid ${S.line}`, borderRadius: 8, padding: "7px 9px", outline: "none" }} />
            </div>
            <button onClick={() => supprimerPresta(p.id)} title="Supprimer"
              style={{ width: 30, height: 30, flex: "none", marginTop: 17, border: `1px solid ${S.line}`, background: "#fff", borderRadius: 8, color: S.soft, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Trash2 size={13} />
            </button>
          </div>
          <div style={{ marginTop: 9 }}>
            <div style={{ fontSize: 9.5, letterSpacing: "0.07em", textTransform: "uppercase", color: S.deep, fontWeight: 700, marginBottom: 3 }}>Détail</div>
            <textarea value={p.detail || ""} onChange={(e) => majPresta(p.id, "detail", e.target.value)} rows={2} placeholder="Ce que le client obtient"
              style={{ width: "100%", fontSize: 13, lineHeight: 1.5, color: S.soft, background: "#fff", border: `1px solid ${S.line}`, borderRadius: 8, padding: "8px 9px", outline: "none", resize: "vertical", minHeight: 44 }} />
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
            {[["rec", "Récurrent"], ["one", "Ponctuel"]].map(([v, l]) => (
              <button key={v} onClick={() => majPresta(p.id, "type", v)}
                style={{ flex: 1, padding: "7px 6px", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: "pointer", border: `1px solid ${p.type === v ? S.deep : S.line}`, background: p.type === v ? S.deep : "#fff", color: p.type === v ? S.cream : S.soft }}>{l}</button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 9, flexWrap: "wrap" }}>
            <ChO label={p.type === "rec" ? "€ / mois" : "€ total"}>
              <input type="number" value={p.prix} min="0" step="10" onChange={(e) => majPresta(p.id, "prix", Math.max(0, Number(e.target.value) || 0))} style={numObj} />
            </ChO>
            {p.type === "rec" && (
              <ChO label="Durée">
                <input type="number" value={p.duree} min="1" max="36" onChange={(e) => majPresta(p.id, "duree", Math.max(1, Number(e.target.value) || 1))} style={numObj} />
              </ChO>
            )}
            <ChO label={p.type === "rec" ? "Missions / an" : "Ventes / an"}>
              <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                <button onClick={() => majPresta(p.id, "qty", Math.max(0, Number(p.qty) - 1))} style={stepObj}>−</button>
                <input type="number" value={p.qty} min="0" onChange={(e) => majPresta(p.id, "qty", Math.max(0, Number(e.target.value) || 0))} style={{ ...numObj, width: 46, textAlign: "center" }} />
                <button onClick={() => majPresta(p.id, "qty", Number(p.qty) + 1)} style={stepObj}>+</button>
              </div>
            </ChO>
          </div>
          <div style={{ display: "flex", gap: 14, marginTop: 10, paddingTop: 9, borderTop: `1px dashed ${S.line}`, fontSize: 12, flexWrap: "wrap" }}>
            {p.type === "rec" && <div><span style={{ color: S.soft }}>Valeur mission </span><b style={{ ...serif, fontSize: 15 }}>{eur(objValeurMission(p))}</b></div>}
            <div><span style={{ color: S.soft }}>CA de la ligne </span><b style={{ ...serif, fontSize: 15, color: S.deep }}>{eur(objCaLigne(p))}</b></div>
          </div>
        </div>
      ))}

      <button onClick={ajouterPresta} style={{ width: "100%", marginTop: 14, border: `1.5px dashed ${S.gold}`, background: "transparent", color: S.deep, fontWeight: 600, fontSize: 14, padding: 13, borderRadius: 12, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
        <Plus size={16} /> Ajouter une prestation
      </button>

      <div style={{ fontSize: 11.5, color: S.soft, marginTop: 18, borderTop: `1px solid ${S.line}`, paddingTop: 12, lineHeight: 1.6 }}>
        Simulation d'une année pleine (planification), distincte du suivi réel. Une mission récurrente vaut son prix mensuel × sa durée. Le total sert d'objectif annuel comparé à ton CA réellement signé.
      </div>
    </div>
  );
}
function ChO({ label, children }) {
  return (
    <div style={{ flex: "1 1 92px", minWidth: 0 }}>
      <div style={{ fontSize: 9.5, letterSpacing: "0.07em", textTransform: "uppercase", color: S.deep, fontWeight: 700, marginBottom: 3 }}>{label}</div>
      {children}
    </div>
  );
}
const numObj = { width: "100%", padding: "8px 9px", borderRadius: 8, border: `1px solid ${S.line}`, background: "#fff", fontSize: 14, color: S.ink, fontWeight: 600 };
const stepObj = { width: 28, height: 32, flex: "none", border: `1px solid ${S.line}`, background: "#fff", borderRadius: 8, color: S.deep, fontSize: 16, fontWeight: 700, cursor: "pointer", lineHeight: 1 };

/* ================= MODALES ================= */
function Modal({ children, onClose, bas }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(38,35,31,.55)", display: "flex", alignItems: bas ? "flex-end" : "center", justifyContent: "center", zIndex: 70, padding: bas ? 0 : 20 }}
      onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div style={{ background: S.cream, width: "100%", maxWidth: 560, borderRadius: bas ? "18px 18px 0 0" : 16, padding: bas ? "22px 18px 30px" : 24, maxHeight: "92vh", overflowY: "auto" }}>
        {children}
      </div>
    </div>
  );
}

function FicheProspect({ p, sourcesList, onClose, onSave, onDelete }) {
  const [f, setF] = useState({ ...p });
  const set = (k, v) => setF({ ...f, [k]: v });
  return (
    <Modal onClose={onClose} bas>
      <TitreModale titre={p.societe || p.nom ? "Modifier le prospect" : "Nouveau prospect"} onClose={onClose} />
      <div style={{ display: "flex", gap: 10 }}>
        <Ch label="Société" flex><input value={f.societe} onChange={(e) => set("societe", e.target.value)} placeholder="Cabinet, enseigne…" style={inp} /></Ch>
        <Ch label="Contact" flex><input value={f.nom} onChange={(e) => set("nom", e.target.value)} placeholder="Prénom Nom" style={inp} /></Ch>
      </div>
      <Ch label="Étape">
        <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
          {ETAPES.map((e) => (
            <button key={e.id} onClick={() => set("etape", e.id)} style={{ flex: "1 1 30%", padding: "8px 6px", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: "pointer", border: `1px solid ${f.etape === e.id ? e.col : S.line}`, background: f.etape === e.id ? e.col : "#fff", color: f.etape === e.id ? "#fff" : S.soft }}>{e.nom}</button>
          ))}
        </div>
      </Ch>
      <Ch label="Type de prestation">
        <select value={f.type || ""} onChange={(e) => set("type", e.target.value)} style={inp}>
          <option value="">— à préciser —</option>
          {TYPES.map((t) => <option key={t.id} value={t.id}>{t.nom}</option>)}
        </select>
      </Ch>
      <div style={{ display: "flex", gap: 12 }}>
        <Ch label={est(f.type).rec ? "Montant € / mois" : "Montant € (total)"} flex><input type="number" value={f.montant} onChange={(e) => set("montant", e.target.value)} style={inp} /></Ch>
        <Ch label="Source" flex>
          <select value={f.source || ""} onChange={(e) => set("source", e.target.value)} style={inp}>
            <option value="">— aucune —</option>
            {sourcesList.map((s) => <option key={s} value={s}>{s}</option>)}
            {f.source && !sourcesList.includes(f.source) && <option value={f.source}>{f.source}</option>}
          </select>
        </Ch>
      </div>
      <Ch label="Offre visée"><input value={f.offre} onChange={(e) => set("offre", e.target.value)} placeholder="Visible & Rentable…" style={inp} /></Ch>
      <Ch label="Prochaine relance"><input type="date" value={f.relance} onChange={(e) => set("relance", e.target.value)} style={inp} /></Ch>
      <Ch label="Note"><textarea value={f.note} onChange={(e) => set("note", e.target.value)} rows={2} placeholder="Contexte, dernier échange…" style={{ ...inp, resize: "vertical", minHeight: 46 }} /></Ch>
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <button onClick={() => onDelete(p.id)} style={{ ...btnIcon, padding: "13px 15px", color: S.rust }}><Trash2 size={15} /></button>
        <button onClick={() => onSave(f)} style={btnMain}><Check size={16} /> Enregistrer</button>
      </div>
    </Modal>
  );
}

function FicheSignature({ p, onClose, onConfirm }) {
  const [f, setF] = useState({
    nom: p.societe || p.nom || "", type: p.type || "prog", prix: p.montant || "", debut: FY[0].key, duree: 6,
  });
  const set = (k, v) => setF({ ...f, [k]: v });
  return (
    <Modal onClose={onClose} bas>
      <TitreModale titre="Signature — détails de la prestation" onClose={onClose} />
      <div style={{ background: "#EDF1EC", border: `1px solid ${S.line}`, borderRadius: 10, padding: "9px 12px", fontSize: 12.5, color: S.green, marginBottom: 12 }}>
        Bravo. Renseigne le contrat, le CA se répartit automatiquement sur les mois.
      </div>
      <Ch label="Nom du contrat"><input value={f.nom} onChange={(e) => set("nom", e.target.value)} style={inp} /></Ch>
      <Ch label="Type">
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {TYPES.map((t) => (
            <button key={t.id} onClick={() => set("type", t.id)} style={{ flex: "1 1 46%", padding: "9px 8px", borderRadius: 9, fontSize: 12.5, fontWeight: 600, cursor: "pointer", border: `1px solid ${f.type === t.id ? S.deep : S.line}`, background: f.type === t.id ? S.deep : "#fff", color: f.type === t.id ? S.cream : S.soft }}>{t.nom}</button>
          ))}
        </div>
      </Ch>
      <div style={{ display: "flex", gap: 10 }}>
        <Ch label={est(f.type).rec ? "€ / mois" : "€ total"} flex><input type="number" value={f.prix} onChange={(e) => set("prix", e.target.value)} style={inp} /></Ch>
        {est(f.type).rec && <Ch label="Durée (mois)" flex><input type="number" value={f.duree} min="1" max="36" onChange={(e) => set("duree", e.target.value)} style={inp} /></Ch>}
      </div>
      <Ch label={est(f.type).rec ? "Mois de démarrage" : "Mois de facturation"}>
        <select value={f.debut} onChange={(e) => set("debut", e.target.value)} style={inp}>
          {CHOIX.map((o) => <option key={o.key} value={o.key}>{lab(o.y, o.m)}{o.idx < 0 ? " (exercice préc.)" : o.idx > 11 ? " (exercice suiv.)" : ""}</option>)}
        </select>
      </Ch>
      <button onClick={() => (f.nom.trim() && Number(f.prix) > 0) && onConfirm(f)} disabled={!f.nom.trim() || !(Number(f.prix) > 0)}
        style={{ ...btnMain, marginTop: 8, background: !f.nom.trim() || !(Number(f.prix) > 0) ? S.line : S.panel, color: !f.nom.trim() || !(Number(f.prix) > 0) ? S.soft : S.cream }}>
        <Check size={16} /> Créer le contrat
      </button>
    </Modal>
  );
}

function FicheClient({ c, sourcesList, onClose, onSave, onDelete }) {
  const [f, setF] = useState({ ...c });
  const set = (k, v) => setF({ ...f, [k]: v });
  const existant = isNotionId(c.id);
  return (
    <Modal onClose={onClose} bas>
      <TitreModale titre={c.nom ? "Modifier le contrat" : "Nouveau contrat"} onClose={onClose} />
      <Ch label="Nom du contrat"><input value={f.nom} onChange={(e) => set("nom", e.target.value)} placeholder="Ex. Optel Services" style={inp} /></Ch>
      <Ch label="Type">
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {TYPES.map((t) => (
            <button key={t.id} onClick={() => set("type", t.id)} style={{ flex: "1 1 46%", padding: "9px 8px", borderRadius: 9, fontSize: 12.5, fontWeight: 600, cursor: "pointer", border: `1px solid ${f.type === t.id ? S.deep : S.line}`, background: f.type === t.id ? S.deep : "#fff", color: f.type === t.id ? S.cream : S.soft }}>{t.nom}</button>
          ))}
        </div>
      </Ch>
      <div style={{ display: "flex", gap: 10 }}>
        <Ch label={f.type === "bni" ? "€ par unité" : est(f.type).rec ? "€ / mois" : "€ total"} flex><input type="number" value={f.prix} onChange={(e) => set("prix", e.target.value)} style={inp} /></Ch>
        {est(f.type).rec && <Ch label="Durée (mois)" flex><input type="number" value={f.duree} min="1" max="36" onChange={(e) => set("duree", e.target.value)} style={inp} /></Ch>}
        {f.type === "bni" && <Ch label="Nombre" flex><input type="number" value={f.nombre ?? 1} min="1" onChange={(e) => set("nombre", Math.max(1, Number(e.target.value) || 1))} style={inp} /></Ch>}
      </div>
      {f.type === "bni" && Number(f.prix) > 0 && (
        <div style={{ fontSize: 12.5, color: S.deep, marginTop: -6, marginBottom: 12 }}>Total : <b>{eur(Number(f.prix) * (Number(f.nombre) || 1))}</b> ({eur(f.prix)} × {Number(f.nombre) || 1})</div>
      )}
      <Ch label={f.type === "bni" ? "Mois de commission" : est(f.type).rec ? "Mois de démarrage" : "Mois de signature"}>
        <select value={f.debut} onChange={(e) => set("debut", e.target.value)} style={inp}>
          {CHOIX.map((o) => <option key={o.key} value={o.key}>{lab(o.y, o.m)}{o.idx < 0 ? " (exercice préc.)" : o.idx > 11 ? " (exercice suiv.)" : ""}</option>)}
        </select>
      </Ch>
      <Ch label="Source du business">
        <select value={f.source || ""} onChange={(e) => set("source", e.target.value)} style={inp}>
          <option value="">— aucune —</option>
          {sourcesList.map((s) => <option key={s} value={s}>{s}</option>)}
          {f.source && !sourcesList.includes(f.source) && <option value={f.source}>{f.source}</option>}
        </select>
      </Ch>
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        {existant && <button onClick={() => onDelete(c)} title="Supprimer le contrat" style={{ ...btnIcon, padding: "13px 15px", color: S.rust }}><Trash2 size={15} /></button>}
        <button onClick={() => (f.nom.trim() && Number(f.prix) > 0) && onSave(f)} disabled={!f.nom.trim() || !(Number(f.prix) > 0)}
          style={{ ...btnMain, background: !f.nom.trim() || !(Number(f.prix) > 0) ? S.line : S.panel, color: !f.nom.trim() || !(Number(f.prix) > 0) ? S.soft : S.cream }}>
          <Check size={16} /> Enregistrer
        </button>
      </div>
      <p style={{ fontSize: 11.5, color: S.soft, marginTop: 10, lineHeight: 1.5 }}>Modifier le prix, la durée ou les dates recalcule la répartition du CA sur les mois.</p>
    </Modal>
  );
}

function TitreModale({ titre, onClose }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
      <span style={{ ...serif, fontSize: 20, fontWeight: 600, color: S.ink }}>{titre}</span>
      <button onClick={onClose} style={btnIcon}><X size={16} /></button>
    </div>
  );
}
function Ch({ label, children, flex }) {
  return (
    <div style={{ marginBottom: 15, flex: flex ? 1 : undefined, minWidth: 0 }}>
      <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: S.deep, fontWeight: 600, marginBottom: 5 }}>{label}</div>
      {children}
    </div>
  );
}
const inp = { width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${S.line}`, background: "#fff", fontSize: 14.5, color: S.ink, fontWeight: 500 };
const btnMain = { width: "100%", padding: 14, borderRadius: 12, border: "none", background: S.panel, color: S.cream, fontWeight: 600, fontSize: 14.5, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 7 };
const btnSec = { flex: 1, padding: 12, borderRadius: 10, border: `1px solid ${S.line}`, background: "#fff", color: S.soft, fontWeight: 600, fontSize: 13.5, cursor: "pointer" };
const btnAdd = { border: `1.5px dashed ${S.gold}`, background: "transparent", color: S.deep, fontWeight: 600, fontSize: 13.5, borderRadius: 11, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 };
const btnIcon = { height: 32, minWidth: 32, border: `1px solid ${S.line}`, background: "#fff", borderRadius: 8, color: S.soft, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" };

ReactDOM.createRoot(document.getElementById("root")).render(<Cockpit />);
</script>
</body>
</html>
