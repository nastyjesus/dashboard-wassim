name: Deploy backlink-radar worker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to deploy from"
        type: string
        default: main
  # Déploiement automatique quand le code du worker change sur sa branche.
  push:
    branches: [feat/backlink-radar]
    paths: ['workers/backlink-radar/**', '.github/workflows/deploy-backlink-radar-worker.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/backlink-radar
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/backlink-radar/package-lock.json

      - run: npm ci

      - run: npm test

      # Crée la base D1 si besoin et injecte son id dans wrangler.toml.
      - name: Ensure D1 database and inject id
        run: |
          get_id() {
            npx wrangler d1 list --json 2>/dev/null \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const a=d.indexOf('[');const b=d.lastIndexOf(']');let l=[];try{l=JSON.parse(d.slice(a,b+1))}catch{};const n=l.find(x=>x.name==='backlink-radar');process.stdout.write(n?(n.uuid||n.id||''):'')})"
          }
          id=$(get_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create backlink-radar
            id=$(get_id)
          fi
          if [ -z "$id" ]; then echo "Could not resolve D1 id for backlink-radar" >&2; exit 1; fi
          sed -i "s/^database_id = \".*\"/database_id = \"$id\"/" wrangler.toml
          grep '^database_id' wrangler.toml

      # Schéma idempotent (CREATE TABLE IF NOT EXISTS) rejoué à chaque deploy.
      - name: Apply schema
        run: npx wrangler d1 execute backlink-radar --remote --file=schema.sql

      - name: Provision auth secret
        env:
          WASSIM_AUTH_TOKEN: ${{ secrets.WASSIM_AUTH_TOKEN }}
        run: |
          if [ -n "$WASSIM_AUTH_TOKEN" ]; then
            printf '%s' "$WASSIM_AUTH_TOKEN" | npx wrangler secret put WASSIM_AUTH_TOKEN
          else
            echo "WASSIM_AUTH_TOKEN not set; every authenticated route will answer 401" >&2
          fi

      - run: npx wrangler deploy

      # Lecture seule : santé, refus sans token, liste des clients avec token.
      # Aucune donnée de test n'est écrite dans la base de production.
      - name: Smoke test
        env:
          WASSIM_AUTH_TOKEN: ${{ secrets.WASSIM_AUTH_TOKEN }}
        run: |
          base="https://backlink-radar-wassim.loumiwassim.workers.dev"
          for i in 1 2 3 4 5; do
            sleep 3
            curl -fsS "$base/health" | grep -q '"db":true' && break
            [ "$i" = 5 ] && { echo "Worker not healthy" >&2; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/clients")
          [ "$code" = 401 ] || { echo "Expected 401 without token, got $code" >&2; exit 1; }
          if [ -n "$WASSIM_AUTH_TOKEN" ]; then
            curl -fsS "$base/clients" -H "X-Wassim-Auth: $WASSIM_AUTH_TOKEN" | grep -q '"clients"' \
              || { echo "GET /clients failed" >&2; exit 1; }
          fi
          echo "Smoke OK"
