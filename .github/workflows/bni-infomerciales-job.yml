name: BNI infomerciales

# Applique les photos déposées par les membres au deck OneDrive.
# Ce fichier doit vivre sur main (seule branche lue par cron et
# workflow_dispatch) ; le code, lui, est pris sur la branche de travail.
# Dépôt public : le script n'affiche que des compteurs, jamais de noms.

on:
  schedule:
    # Deux passages à l'heure de Paris : mercredi 19h (limite des dépôts),
    # jeudi 12h (retardataires). Chaque passage a trois crons UTC (été, hiver,
    # rattrapage) : job.py publie au premier qui tombe après l'heure de Paris
    # et sort sans rien faire aux suivants (créneau déjà réussi).
    - cron: "5 17 * * 3"
    - cron: "5 18 * * 3"
    - cron: "5 19 * * 3"
    - cron: "0 10 * * 4"
    - cron: "0 11 * * 4"
    - cron: "0 12 * * 4"
  workflow_dispatch:

concurrency:
  group: bni-infomerciales
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: scripts/bni-infomerciales
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/side-hustle-brainstorm-ykikf8
          sparse-checkout: scripts/bni-infomerciales

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/bni-infomerciales/requirements.txt

      - run: pip install -r requirements.txt

      # rclone renouvelle le jeton Microsoft (pas d'inscription Azure)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Mettre à jour le deck
        env:
          WORKER_URL: https://bni-infomerciales.loumiwassim.workers.dev
          WASSIM_AUTH_TOKEN: ${{ secrets.WASSIM_AUTH_TOKEN }}
          # vide pour un lancement manuel : pas de contrôle de créneau
          CRON: ${{ github.event.schedule }}
        run: python job.py
