name: Deploy gsc-report worker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to deploy from"
        type: string
        default: main
      provision-secrets:
        description: "Provision/refresh Google + Notion + auth secrets before deploy"
        type: boolean
        default: true
      mock-mode:
        description: "Deploy with MOCK_MODE (demo data)"
        type: boolean
        default: false
  # Déploiement automatique quand le code du worker change sur la branche de
  # travail (la session distante n'a pas le droit de dispatch manuel).
  push:
    branches: [claude/seo-expert-optimization-pu2z52]
    paths: ['workers/gsc-report/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/gsc-report
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/gsc-report/package-lock.json

      - run: npm ci

      - run: npm test

      # Crée le namespace KV s'il n'existe pas et injecte son id dans
      # wrangler.toml — aucune manipulation manuelle Cloudflare nécessaire.
      - name: Ensure KV namespace and inject id
        run: |
          title="gsc-report-wassim-REPORTS"
          get_id() {
            npx wrangler kv namespace list 2>/dev/null \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const a=d.indexOf('[');const b=d.lastIndexOf(']');let l=[];try{l=JSON.parse(d.slice(a,b+1))}catch{};const n=l.find(x=>x.title===process.argv[1]);process.stdout.write(n?n.id:'')})" "$title"
          }
          id=$(get_id)
          if [ -z "$id" ]; then
            npx wrangler kv namespace create REPORTS
            id=$(get_id)
          fi
          if [ -z "$id" ]; then echo "Could not resolve KV namespace id for $title" >&2; exit 1; fi
          sed -i "s/^id = \".*\"/id = \"$id\"/" wrangler.toml
          grep '^id = ' wrangler.toml

      - name: Set MOCK_MODE
        env:
          MODE: ${{ inputs.mock-mode }}
        run: |
          sed -i "s/^MOCK_MODE = \".*\"/MOCK_MODE = \"$MODE\"/" wrangler.toml
          grep '^MOCK_MODE' wrangler.toml

      - name: Provision secrets
        if: ${{ inputs.provision-secrets }}
        env:
          GOOGLE_SA_EMAIL: ${{ secrets.GOOGLE_SA_EMAIL }}
          GOOGLE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          WASSIM_AUTH_TOKEN: ${{ secrets.WASSIM_AUTH_TOKEN }}
        run: |
          if [ -n "$GOOGLE_SA_EMAIL" ] && [ -n "$GOOGLE_SA_PRIVATE_KEY" ]; then
            printf '%s' "$GOOGLE_SA_EMAIL"       | npx wrangler secret put GOOGLE_SA_EMAIL
            printf '%s' "$GOOGLE_SA_PRIVATE_KEY" | npx wrangler secret put GOOGLE_SA_PRIVATE_KEY
          else
            echo "GOOGLE_SA_EMAIL/GOOGLE_SA_PRIVATE_KEY not both set; worker stays in mock mode"
          fi
          if [ -n "$NOTION_TOKEN" ]; then
            printf '%s' "$NOTION_TOKEN"          | npx wrangler secret put NOTION_TOKEN
          else
            echo "NOTION_TOKEN not set; Notion logging disabled"
          fi
          printf '%s' "$WASSIM_AUTH_TOKEN"       | npx wrangler secret put WASSIM_AUTH_TOKEN

      - run: npx wrangler deploy

      - name: Smoke test /health
        run: |
          for i in 1 2 3 4 5; do
            sleep 3
            out=$(curl -fsS "https://gsc-report-wassim.loumiwassim.workers.dev/health" || true)
            echo "$out"
            echo "$out" | grep -q '"ok":true' && exit 0
          done
          echo "Worker did not become healthy in time" >&2
          exit 1
        continue-on-error: true
