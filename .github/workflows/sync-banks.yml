name: Sync banks (woob)

on:
  # Cron GH Actions désactivé : Fortuneo 403 les IP Azure datacenter (WAF anti-bot).
  # Le sync tourne désormais en local via launchd sur le Mac (cf. scripts/sync-banks/install-mac.sh).
  # On garde workflow_dispatch pour debug manuel ponctuel.
  workflow_dispatch:
    inputs:
      banks_only:
        description: "Banques à syncer (laisser vide = toutes)"
        type: string
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/sync-banks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/sync-banks/requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore woob config from secret
        env:
          WOOB_CONFIG_B64: ${{ secrets.WOOB_CONFIG_B64 }}
        run: |
          if [ -z "$WOOB_CONFIG_B64" ]; then
            echo "::error::WOOB_CONFIG_B64 secret is empty"
            exit 1
          fi
          mkdir -p woob-data
          echo "$WOOB_CONFIG_B64" | base64 --decode > woob-config.tar.gz
          tar -xzf woob-config.tar.gz -C woob-data
          ls -la woob-data/

      - name: Run sync
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WASSIM_AUTH_TOKEN: ${{ secrets.WASSIM_AUTH_TOKEN }}
          WOOB_DATA_DIR: ${{ github.workspace }}/scripts/sync-banks/woob-data
        run: python sync-banks.py
