name: Test automations (GSC + GEO)

# Harnais de test des deux workers, pilotable à distance (workflow_dispatch).
# Utilise le WASSIM_AUTH_TOKEN des secrets — le token ne sort jamais des logs.
# Les configs clients viennent d'automations.html (source de vérité unique).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Quoi tester"
        type: choice
        options: [health, push-config, run-gsc, run-geo, all]
        default: all
      gsc-period:
        description: "Mois GSC (YYYY-MM, vide = mois précédent)"
        type: string
        default: ""
      geo-client:
        description: "Client GEO (id, vide = tous les clients un par un)"
        type: string
        default: ""
  # Déclenchement par push : committer .github/test-request.json sur la branche
  # de travail lance le test avec les paramètres du fichier. Permet de piloter
  # les tests depuis une session distante sans droit « Actions write ».
  push:
    branches: [claude/seo-expert-optimization-pu2z52]
    paths: ['.github/test-request.json']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.WASSIM_AUTH_TOKEN }}
      GSC: https://gsc-report-wassim.loumiwassim.workers.dev
      GEO: https://geo-tracker-wassim.loumiwassim.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Résoudre les paramètres (dispatch ou test-request.json)
        env:
          IN_TARGET: ${{ inputs.target }}
          IN_PERIOD: ${{ inputs.gsc-period }}
          IN_CLIENT: ${{ inputs.geo-client }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/test-request.json ]; then
            TARGET=$(node -e "console.log(require('./.github/test-request.json').target||'all')")
            PERIOD=$(node -e "console.log(require('./.github/test-request.json')['gsc-period']||'')")
            CLIENT=$(node -e "console.log(require('./.github/test-request.json')['geo-client']||'')")
          else
            TARGET="${IN_TARGET:-all}"; PERIOD="$IN_PERIOD"; CLIENT="$IN_CLIENT"
          fi
          { echo "TARGET=$TARGET"; echo "PERIOD=$PERIOD"; echo "CLIENT=$CLIENT"; } >> "$GITHUB_ENV"
          echo "→ target=$TARGET period=$PERIOD client=$CLIENT"

      - name: Health des deux workers
        run: |
          echo "== GSC /health =="
          curl -sS --max-time 30 -w '\nHTTP %{http_code}\n' "$GSC/health"
          echo "== GEO /health =="
          curl -sS --max-time 30 -w '\nHTTP %{http_code}\n' "$GEO/health"

      - name: Pousser les configs clients
        if: env.TARGET == 'push-config' || env.TARGET == 'all'
        run: |
          node .github/scripts/extract-configs.js gsc > /tmp/gsc.json
          node .github/scripts/extract-configs.js geo > /tmp/geo.json
          echo "== PUT $GSC/clients =="
          curl -sS --max-time 60 -w '\nHTTP %{http_code}\n' -X PUT "$GSC/clients" \
            -H "X-Wassim-Auth: $TOKEN" -H "Content-Type: application/json" --data @/tmp/gsc.json
          echo "== PUT $GEO/clients =="
          curl -sS --max-time 60 -w '\nHTTP %{http_code}\n' -X PUT "$GEO/clients" \
            -H "X-Wassim-Auth: $TOKEN" -H "Content-Type: application/json" --data @/tmp/geo.json

      - name: Générer les rapports GSC
        if: env.TARGET == 'run-gsc' || env.TARGET == 'all'
        run: |
          body='{}'
          [ -n "$PERIOD" ] && body="{\"period\":\"$PERIOD\"}"
          echo "== POST $GSC/run ($body) =="
          curl -sS --max-time 300 -w '\nHTTP %{http_code}\n' -X POST "$GSC/run" \
            -H "X-Wassim-Auth: $TOKEN" -H "Content-Type: application/json" -d "$body"

      - name: Relevé GEO (client par client pour éviter les timeouts)
        if: env.TARGET == 'run-geo' || env.TARGET == 'all'
        run: |
          if [ -n "$CLIENT" ]; then
            ids="$CLIENT"
          else
            node .github/scripts/extract-configs.js geo > /tmp/geo.json
            ids=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/geo.json')).map(c=>c.id).join(' '))")
          fi
          for id in $ids; do
            echo "== POST $GEO/run (client: $id) =="
            curl -sS --max-time 480 -w '\nHTTP %{http_code}\n' -X POST "$GEO/run" \
              -H "X-Wassim-Auth: $TOKEN" -H "Content-Type: application/json" -d "{\"client\":\"$id\"}"
          done

      - name: État final (latest des deux workers)
        run: |
          echo "== GET $GSC/latest =="
          curl -sS --max-time 60 -w '\nHTTP %{http_code}\n' "$GSC/latest" -H "X-Wassim-Auth: $TOKEN"
          echo "== GET $GEO/latest =="
          curl -sS --max-time 60 -w '\nHTTP %{http_code}\n' "$GEO/latest" -H "X-Wassim-Auth: $TOKEN"
