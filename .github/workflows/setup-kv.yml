name: Setup Cloudflare KV namespace

# Workflow one-shot — crée le KV namespace SCRAPED côté Cloudflare et
# remplit son id dans wrangler.toml. À lancer une fois après le merge initial.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/bridge-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/bridge-proxy/package-lock.json

      - run: npm ci

      - name: Create KV namespace (idempotent — ignores if exists)
        id: kv
        run: |
          set -e
          # Tente la création ; si déjà existant, on ignore l'erreur et on liste pour récupérer l'id.
          OUT=$(npx wrangler kv:namespace create SCRAPED 2>&1 || true)
          echo "$OUT"
          ID=$(echo "$OUT" | grep -oE 'id = "[a-f0-9]+"' | head -1 | grep -oE '[a-f0-9]{32}')
          if [ -z "$ID" ]; then
            echo "Création KO ou déjà existant — on liste pour retrouver l'id"
            LIST=$(npx wrangler kv:namespace list)
            echo "$LIST"
            ID=$(echo "$LIST" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((n['id'] for n in d if 'SCRAPED' in n.get('title','')),''))")
          fi
          if [ -z "$ID" ]; then
            echo "::error::Impossible de récupérer l'id du namespace SCRAPED"
            exit 1
          fi
          echo "Namespace id = $ID"
          echo "kv_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Patch wrangler.toml with KV id
        run: |
          sed -i 's|REPLACE_WITH_KV_ID|${{ steps.kv.outputs.kv_id }}|' wrangler.toml
          grep -A 2 "kv_namespaces" wrangler.toml

      - name: Commit and push wrangler.toml
        run: |
          cd ../..
          if git diff --quiet workers/bridge-proxy/wrangler.toml; then
            echo "wrangler.toml already up to date — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/bridge-proxy/wrangler.toml
          git commit -m "Set Cloudflare KV namespace id for SCRAPED bucket"
          git push origin main
